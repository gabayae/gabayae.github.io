course:
  slug: "mlops"
  title: "MLOps — From Notebook to Production"
  short_title: "MLOps"
  level: "Graduate / professional"
  pitch: "What it takes for a machine-learning model to keep working after the notebook is closed: containerization, deployment, monitoring, reproducibility, and the engineering discipline that distinguishes a prototype from a production system."
  meeting_pattern: "Tuesdays + Thursdays, 14:00–16:00 lecture · Fridays 14:00–15:00 systems review (Africa/Lagos UTC+1)"
  prerequisites: "Comfortable Python (functions, classes, virtual environments). At least one prior ML project (any course in the catalogue). Basic command-line proficiency. Familiarity with Git."
  grading: "Five labs (50%) · two systems-design memos (20%) · final deployed capstone (30%)."
  notes_pdf: "/courses/mlops/en/notes.pdf"
  notes_pdf_fr: "/courses/mlops/fr/cours.pdf"
  textbook: "Chip Huyen, *Designing Machine Learning Systems* (O'Reilly 2022) — recommended companion."
  instructor: "Dr. Yaé Ulrich Gaba"
  status: "self-study"   # self-study | upcoming | active | archive

defaults:
  pset_due: "Sunday 23:59"
  pset_submission: "Pull request on the cohort GitHub organization; lab repos are mirrored to the participant's personal GitHub on completion."
  recitation: "Friday 14:00 (Africa/Lagos)"

weeks:
  - number: "01"
    title: "Introduction to MLOps — From Notebook to Production"
    pitch: "Sculley's 2015 diagram: the ML model is 5% of an ML system. This course is about the other 95%."
    lecture_topic: "Why models that work in notebooks fail in production · the technical-debt diagram (Sculley et al. 2015) · the six phases of model lifecycle · standard failure modes (data drift, training-serving skew, ghost models)."
    readings:
      - { ref: "Sculley et al., *Hidden Technical Debt in Machine Learning Systems* (NeurIPS 2015)", url: "https://papers.nips.cc/paper/2015/hash/86df7dcfd896fcaf2674f757a2463eba-Abstract.html" }

  - number: "02"
    title: "Environments and Dependency Management"
    pitch: "The first thing that breaks: dependencies. The current toolchain and the patterns that survive in production."
    lecture_topic: "The dependency hell problem · virtualenv, conda, mamba, pipenv, poetry, uv · pyproject.toml and lockfiles · devcontainers · Docker as an environment · trade-offs (reproducibility vs speed)."
    code_lab:
      title: "Lab 1 — Reproducible Python environment"
      task: "Set up a project with `uv` + `pyproject.toml` + lockfile + pre-commit hooks. Add a Dockerfile that reproduces the same environment. Verify identical behavior on host and container."
      notebook: "lab01-environments.ipynb"
      dataset: "—"

  - number: "03"
    title: "Version Control — Git and DVC"
    pitch: "Code is the easy part. Data and models version differently."
    lecture_topic: "Git for ML projects (branches, hooks, submodules) · DVC for data and model versioning · Git LFS, Pachyderm, lakeFS · MLflow Model Registry · the GitOps workflow."
    readings:
      - { ref: "Iterative.ai, *DVC documentation: Versioning Data and Models*", url: "https://dvc.org/doc/start/data-management" }
    code_lab:
      title: "Lab 2 — Versioning the full ML project"
      task: "Take an existing ML notebook. Version the code in Git, the dataset in DVC, the trained model artifact in MLflow Model Registry. Tag a v1.0 release that reproduces from scratch."
      notebook: "lab02-versioning.ipynb"
      dataset: "Any prior coursework dataset."

  - number: "04"
    title: "Experiment Tracking — MLflow, Weights & Biases"
    pitch: "Six months from now, which hyperparameter combination produced your best result?"
    lecture_topic: "The experiment-tracking problem · MLflow (open source) · Weights & Biases (managed) · Neptune, Comet, ClearML · the run / artifact / metric model · structured logging · dashboard comparison · promotion to a model registry."
    readings:
      - { ref: "MLflow documentation: Tracking", url: "https://mlflow.org/docs/latest/tracking.html" }
    code_lab:
      title: "Lab 3 — Instrumented training loop"
      task: "Take any training script from a prior course. Add MLflow tracking (parameters, metrics, artifacts). Run a hyperparameter sweep. Promote the best model to the registry."
      notebook: "lab03-tracking.ipynb"
      dataset: "Same as Lab 2."

  - number: "05"
    title: "Data Pipelines and Feature Stores"
    pitch: "Orchestration: the chain of transformations from raw data to model-ready features, running on a schedule, observable, idempotent."
    lecture_topic: "DAGs for data pipelines · Airflow (Beauchemin 2014) · Prefect, Dagster, Metaflow, Kubeflow Pipelines · feature stores (Feast, Hopsworks) · idempotence, backfill, late-arriving data · the training-serving feature parity problem."
    readings:
      - { ref: "Beauchemin, *Apache Airflow at Airbnb* (Airbnb engineering blog 2015)", url: "https://medium.com/airbnb-engineering/airflow-a-workflow-management-platform-46318b977fd8" }
    discussion:
      paper: "Hermann and Del Balso, *Meet Michelangelo: Uber's Machine Learning Platform* (Uber engineering 2017)"
      url: "https://www.uber.com/blog/michelangelo-machine-learning-platform/"
      prompts:
        - "What does Michelangelo solve that a notebook + Airflow doesn't?"
        - "What's the smallest team for which Michelangelo's complexity makes sense?"

  - number: "06"
    title: "Large-Scale Training — Distributed Training"
    pitch: "When one GPU stops being enough: data parallelism, model parallelism, and the engineering of training at scale."
    lecture_topic: "Data parallel (DDP, ZeRO) · tensor parallel · pipeline parallel · model parallel · gradient accumulation and gradient checkpointing · mixed precision (FP16, BF16, FP8) · FSDP and DeepSpeed · NCCL and the GPU-interconnect layer."
    readings:
      - { ref: "Rajbhandari et al., *ZeRO: Memory Optimizations Toward Training Trillion Parameter Models* (SC 2020)", url: "https://arxiv.org/abs/1910.02054" }
    problem_set:
      title: "Memo 1 — Pick a training topology"
      problems:
        - "For a 7B-parameter model trained on 8 A100s, design the parallelism topology and justify the choice. Memo, 800 words."

  - number: "07"
    title: "Containerization — Docker for ML"
    pitch: "Build once, run anywhere — finally true for ML, with the right image discipline."
    lecture_topic: "Docker fundamentals (image vs container, layers, cache) · multi-stage builds for slim ML images · CUDA base images · the .dockerignore discipline · security (CVE scanning, non-root users) · Docker Compose for local development."
    readings:
      - { ref: "Docker documentation: Best practices for writing Dockerfiles", url: "https://docs.docker.com/develop/develop-images/dockerfile_best-practices/" }
    code_lab:
      title: "Lab 4 — Minimal ML inference image"
      task: "Build a Docker image for a single-model inference service. Target image size under 500 MB. Document the multi-stage build choices. Push to Docker Hub or GitHub Container Registry."
      notebook: "lab04-docker.ipynb"
      dataset: "Model from Lab 3."

  - number: "08"
    title: "Model Deployment — REST APIs, FastAPI, Streamlit"
    pitch: "The model is in production when an HTTP endpoint serves it. The patterns from prototype demos to high-traffic inference services."
    lecture_topic: "REST API patterns for ML (FastAPI, BentoML) · UI overlays (Streamlit, Gradio, HuggingFace Spaces) · Triton Inference Server for high-throughput serving · KServe and Seldon for Kubernetes · the canary / blue-green / shadow-traffic deployment patterns · SLAs (p99 latency, throughput, availability)."
    readings:
      - { ref: "FastAPI documentation", url: "https://fastapi.tiangolo.com/" }
    code_lab:
      title: "Lab 5 — Deploy a model end-to-end"
      task: "Wrap the model from Lab 3 in FastAPI. Containerize. Deploy to Render or Railway free tier. Verify the endpoint from a fresh notebook. Document the deployment in a 1-page README."
      notebook: "lab05-deployment.ipynb"
      dataset: "Same model as Lab 3."

  - number: "09"
    title: "CI/CD for Machine Learning"
    pitch: "Each commit must be potentially deployable. The CI/CD/CT discipline — where the third T is *continuous training*."
    lecture_topic: "Continuous integration for ML (Humble-Farley 2010 applied) · CI for code, data validation, and model performance · GitHub Actions / GitLab CI patterns for ML · model promotion gates · the continuous-training trigger (data drift, schedule, manual)."
    readings:
      - { ref: "Google Cloud, *MLOps: Continuous delivery and automation pipelines in machine learning*", url: "https://cloud.google.com/architecture/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning" }
    problem_set:
      title: "Memo 2 — Design a CI/CD pipeline"
      problems:
        - "Design the CI/CD/CT pipeline for the model deployed in Lab 5. Diagram the steps, choose the tools, document the failure recovery. Memo, 1000 words."

  - number: "10"
    title: "Model Monitoring in Production"
    pitch: "A deployed model does not self-regulate. It drifts, finds shortcuts, gets exposed to populations the training data never saw."
    lecture_topic: "Performance metrics in production (latency, throughput, error rate) · data drift detection (Kolmogorov-Smirnov, Wasserstein, Population Stability Index) · concept drift · alerting (Grafana, Prometheus, PagerDuty) · the Amazon hiring-model failure as a case study · fairness monitoring (Fairlearn, Evidently)."
    readings:
      - { ref: "Evidently AI, *ML Monitoring Documentation*", url: "https://docs.evidentlyai.com/" }
    discussion:
      paper: "Dastin, *Amazon scraps secret AI recruiting tool that showed bias against women* (Reuters 2018)"
      url: "https://www.reuters.com/article/world/insight-amazon-scraps-secret-ai-recruiting-tool-that-showed-bias-against-women-idUSKCN1MK0AG/"
      prompts:
        - "What would the monitoring system have looked like that caught this?"
        - "Is monitoring sufficient, or is the problem upstream in training data?"

  - number: "11"
    title: "Reproducibility in Research — Standards and Best Practices"
    pitch: "Pineau and Henderson showed in 2017 that identical RL code with different random seeds produces 3× different learning curves. Reproducibility is engineering, not virtue."
    lecture_topic: "The reproducibility crisis (Nature 2016) · ML-specific reproducibility (Pineau and Henderson 2017) · the NeurIPS Reproducibility Checklist · Papers with Code · containerization, seeds, data versioning, dependency pinning · the production-ready research workflow."
    readings:
      - { ref: "Pineau et al., *Improving Reproducibility in Machine Learning Research* (JMLR 2021)", url: "https://www.jmlr.org/papers/v22/20-303.html" }
    discussion:
      paper: "Nature editorial, *1,500 scientists lift the lid on reproducibility* (Nature 2016)"
      url: "https://www.nature.com/articles/533452a"
      prompts:
        - "Has ML reproducibility improved between 2016 and 2026?"
        - "What would a useful reproducibility benchmark look like?"

  - number: "12"
    title: "Final capstone — deploy and defend a system"
    pitch: "Each participant brings a model from any prior course and ships it through the full MLOps pipeline. Final defense, 20 minutes."
    lecture_topic: "Final capstone presentations: each participant defends a deployed system end-to-end (training, tracking, containerization, deployment, monitoring, reproducibility)."
    readings: []
