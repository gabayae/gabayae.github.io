course:
  slug: "apprentissage-renforcement"
  title: "Reinforcement Learning"
  short_title: "RL"
  level: "Graduate"
  pitch: "MDPs, dynamic programming, Q-learning, policy gradients, actor-critic, modern algorithms (PPO, SAC), and the new RLHF pipeline behind ChatGPT-class systems."
  meeting_pattern: "Mondays + Wednesdays, 14:00–16:00 lecture · Fridays 14:00–15:00 paper discussion (Africa/Lagos UTC+1)"
  prerequisites: "Probability and statistics at the level of expectation, variance, and conditional probability. Linear algebra. Comfortable Python and PyTorch. No prior RL required."
  grading: "Five problem sets (35%) · three code labs (25%) · paper-discussion recitations (10%) · final project (30%)."
  notes_pdf: "/courses/apprentissage-renforcement/en/notes.pdf"
  notes_pdf_fr: "/courses/apprentissage-renforcement/fr/cours.pdf"
  textbook: "Sutton and Barto, *Reinforcement Learning: An Introduction* (2nd ed., MIT Press 2018) — required reference."
  instructor: "Dr. Yaé Ulrich Gaba"

defaults:
  pset_due: "Sunday 23:59"
  pset_submission: "Pull request on the cohort GitHub repository."
  recitation: "Friday 14:00 (Africa/Lagos)"

weeks:
  - number: "01"
    title: "Markov Decision Processes"
    pitch: "The mathematical scaffold under everything in RL: states, actions, transitions, rewards, and the principle of optimality."
    lecture_topic: "MDPs as 5-tuples $(\\mathcal{S},\\mathcal{A},P,r,\\gamma)$ · policies and value functions · the Bellman equations · the principle of optimality · finite-horizon vs infinite-horizon vs average-reward formulations."
    readings:
      - { ref: "Sutton and Barto, chapters 3–4", url: "http://incompleteideas.net/book/the-book-2nd.html" }
    problem_set:
      title: "PS1 — MDP fundamentals"
      problems:
        - "Solve the optimal value function and policy of a 4×4 gridworld with stochastic transitions analytically."
        - "Prove the Bellman optimality equation from the principle of optimality."

  - number: "02"
    title: "Dynamic Programming"
    pitch: "When you have the model, you don't need to learn — you compute. The reference algorithms every learner approximates."
    lecture_topic: "Policy evaluation · policy improvement · policy iteration · value iteration · the contraction-mapping convergence proof · asynchronous DP · generalized policy iteration."
    readings:
      - { ref: "Sutton and Barto, chapter 4", url: "" }
    code_lab:
      title: "Value iteration on a real planning problem"
      task: "Solve a 50-state inventory-management MDP by value iteration. Compare with a hand-designed heuristic policy."
      notebook: "lab01-value-iteration.ipynb"
      dataset: "Synthetic — defined in the notebook."

  - number: "03"
    title: "Monte Carlo and Temporal Difference Methods"
    pitch: "When the model isn't known: learn from sampled trajectories. The MC / TD spectrum is the conceptual backbone of model-free RL."
    lecture_topic: "Monte Carlo policy evaluation · the exploration-exploitation problem · the $\\varepsilon$-greedy and softmax strategies · TD(0) and the TD update · why TD has lower variance than MC."
    readings:
      - { ref: "Sutton and Barto, chapters 5–6", url: "" }
    problem_set:
      title: "PS2 — MC vs TD"
      problems:
        - "Implement first-visit MC and every-visit MC on a simple MDP. Show empirically that both converge."
        - "Implement TD(0). Compare convergence speed and variance against MC on the random-walk problem."

  - number: "04"
    title: "Q-Learning and Temporal Difference Methods"
    pitch: "The off-policy algorithm that unlocks RL: learn the optimal action-value function from any behavior policy."
    lecture_topic: "SARSA (on-policy) vs Q-learning (off-policy) · convergence theorems (Watkins-Dayan 1992) · the importance of the contraction property · $n$-step bootstrapping · double Q-learning."
    readings:
      - { ref: "Sutton and Barto, chapters 6 and 7", url: "" }
      - { ref: "Watkins and Dayan, *Q-learning* (Machine Learning, 1992)", url: "" }
    code_lab:
      title: "Q-learning on FrozenLake and Taxi"
      task: "Train a tabular Q-learning agent on FrozenLake-v1 and Taxi-v3 (Gymnasium). Report learning curves and final reward."
      notebook: "lab02-q-learning.ipynb"
      dataset: "Gymnasium built-in environments."

  - number: "05"
    title: "Deep Q-Networks and Variants"
    pitch: "When the state space is too large for a table: DQN, Atari, and the deep-learning era of RL."
    lecture_topic: "Function approximation in RL · the deadly triad (bootstrapping + off-policy + function approximation) · DQN (Mnih et al. 2015) · experience replay · target networks · double DQN, dueling DQN, rainbow."
    readings:
      - { ref: "Mnih et al., *Human-level control through deep reinforcement learning* (Nature 2015, the DQN paper)", url: "https://www.nature.com/articles/nature14236" }
    problem_set:
      title: "PS3 — DQN diagnostics"
      problems:
        - "Show why naive Q-learning with a neural function approximator can diverge. Construct a 2-state counterexample."
        - "Explain why the target network in DQN breaks the divergence cycle."

  - number: "06"
    title: "Policy Gradient Methods"
    pitch: "Directly optimize the policy, not the value function. The REINFORCE algorithm and its descendants."
    lecture_topic: "The policy gradient theorem · REINFORCE · baseline subtraction for variance reduction · trust region methods (TRPO) · the proximal policy optimization (PPO) trick."
    readings:
      - { ref: "Sutton et al., *Policy Gradient Methods for RL with Function Approximation* (NeurIPS 1999)", url: "" }
      - { ref: "Schulman et al., *Proximal Policy Optimization Algorithms* (2017)", url: "https://arxiv.org/abs/1707.06347" }
    problem_set:
      title: "PS4 — Policy gradient theorem"
      problems:
        - "Prove the policy gradient theorem from the start (Sutton et al. 1999 style)."
        - "Show that subtracting a state-dependent baseline does not change the gradient in expectation."

  - number: "07"
    title: "Actor-Critic Methods"
    pitch: "Combine policy gradients with a learned value function — the best of both worlds, and the foundation of most modern RL."
    lecture_topic: "The actor-critic family · A2C and A3C · GAE (generalized advantage estimation, Schulman et al. 2016) · soft actor-critic (SAC, Haarnoja et al. 2018) · entropy-regularized RL."
    readings:
      - { ref: "Haarnoja et al., *Soft Actor-Critic: Off-Policy Maximum Entropy Deep RL with a Stochastic Actor* (ICML 2018)", url: "https://arxiv.org/abs/1801.01290" }
    code_lab:
      title: "PPO on CartPole and BipedalWalker"
      task: "Train PPO with Stable-Baselines3 on CartPole-v1 (easy) and BipedalWalker-v3 (hard). Tune learning rate, clip range, and entropy coefficient. Report results."
      notebook: "lab03-ppo.ipynb"
      dataset: "Gymnasium environments."

  - number: "08"
    title: "State-of-the-Art Algorithms"
    pitch: "What labs and industry are using in 2026: PPO, SAC, MuZero, IMPALA, and a tour of recent improvements."
    lecture_topic: "PPO and SAC in production · MuZero (Schrittwieser et al. 2020) and learned-model RL · IMPALA (Espeholt et al. 2018) for distributed training · the AlphaZero / MuZero line · offline RL (Levine et al. 2020)."
    readings:
      - { ref: "Schrittwieser et al., *Mastering Atari, Go, Chess and Shogi by Planning with a Learned Model* (Nature 2020, the MuZero paper)", url: "https://www.nature.com/articles/s41586-020-03051-4" }
    discussion:
      paper: "Levine et al., *Offline Reinforcement Learning: Tutorial, Review, and Perspectives on Open Problems* (2020)"
      url: "https://arxiv.org/abs/2005.01643"
      prompts:
        - "When is offline RL the right tool and when isn't it?"
        - "What are the failure modes of behavior-cloning baselines?"

  - number: "09"
    title: "Multi-Agent Reinforcement Learning"
    pitch: "When more than one agent learns at once: cooperation, competition, and the non-stationarity of every other agent."
    lecture_topic: "Markov games as the generalization of MDPs · cooperative vs competitive vs general-sum settings · independent learning vs CTDE (centralized training, decentralized execution) · QMIX and MADDPG · multi-agent emergence."
    readings:
      - { ref: "Lowe et al., *Multi-Agent Actor-Critic for Mixed Cooperative-Competitive Environments* (NeurIPS 2017, MADDPG)", url: "https://arxiv.org/abs/1706.02275" }
    problem_set:
      title: "PS5 — Multi-agent fundamentals"
      problems:
        - "Show that independent Q-learning agents in a simple 2-player Markov game can fail to find a Nash equilibrium."
        - "Implement Iterated Prisoner's Dilemma with two Q-learning agents. What policies emerge?"

  - number: "10"
    title: "Constrained and Safe RL"
    pitch: "When the agent must respect constraints — safety, fairness, resource limits — even during exploration."
    lecture_topic: "Constrained MDPs · Lagrangian methods · CPO (Achiam et al. 2017) · safety filters and shielding · the safety-exploration tension · the open question of safety in RLHF."
    readings:
      - { ref: "Achiam et al., *Constrained Policy Optimization* (ICML 2017)", url: "https://arxiv.org/abs/1705.10528" }
    discussion:
      paper: "Bai et al., *Constitutional AI: Harmlessness from AI Feedback* (Anthropic 2022)"
      url: "https://arxiv.org/abs/2212.08073"
      prompts:
        - "Is constitutional AI a constrained-RL approach in disguise?"
        - "What's the constraint, and how is it enforced?"

  - number: "11"
    title: "Applications"
    pitch: "Three case studies that drove RL into the mainstream: games (AlphaGo line), robotics (Sim2Real), and RLHF for LLMs."
    lecture_topic: "AlphaGo, AlphaZero, MuZero — the architectural arc · Sim2Real for robotics and the domain-randomization trick · RLHF (Christiano 2017 → Ouyang 2022) and DPO (Rafailov 2023) as the LLM-alignment workhorses · the new direct-preference family."
    readings:
      - { ref: "Ouyang et al., *Training language models to follow instructions with human feedback* (NeurIPS 2022, the InstructGPT paper)", url: "https://arxiv.org/abs/2203.02155" }
    discussion:
      paper: "Rafailov et al., *Direct Preference Optimization: Your Language Model is Secretly a Reward Model* (NeurIPS 2023)"
      url: "https://arxiv.org/abs/2305.18290"
      prompts:
        - "DPO removes the explicit reward model — does it remove RL from RLHF, or just hide it?"
        - "What evidence would settle the DPO-vs-PPO debate?"

  - number: "12"
    title: "Final project presentations"
    pitch: "Each participant trains an RL agent on an environment of their choice and presents results."
    lecture_topic: "Final project presentations (15 min each + 5 min Q&A)."
    readings: []
