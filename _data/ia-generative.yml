course:
  slug: "ia-generative"
  title: "Generative AI"
  short_title: "GenAI"
  level: "Graduate"
  pitch: "Transformers, GPT-class language models, prompt engineering, LoRA fine-tuning, RAG, diffusion models, agents, and the evaluation problem none of this has solved."
  meeting_pattern: "Mondays + Wednesdays, 14:00–16:00 lecture · Fridays 14:00–15:00 paper discussion (Africa/Lagos UTC+1)"
  prerequisites: "Deep learning at the level of one prior course. PyTorch fluency. Comfortable reading recent NeurIPS / ICLR papers. Familiarity with the transformer architecture is a plus but not required — week 2 builds it."
  grading: "Four labs (40%) · two paper-discussion reviews (15%) · final deployed agent or RAG system (45%)."
  notes_pdf: "/courses/ia-generative/en/notes.pdf"
  notes_pdf_fr: "/courses/ia-generative/fr/cours.pdf"
  textbook: "No standard textbook — the field moves too fast. Reading list is curated weekly from arXiv."
  instructor: "Dr. Yaé Ulrich Gaba"
  caveat: "Generative AI moves fast enough that the reading list, lab tooling, and code lab versions are reviewed and updated at the start of every cohort. The structure below is stable; the specific models, frameworks, and benchmarks are not."

defaults:
  pset_due: "Sunday 23:59"
  pset_submission: "Pull request on the cohort GitHub organization."
  recitation: "Friday 14:00 (Africa/Lagos)"

weeks:
  - number: "01"
    title: "Foundations of Language Models"
    pitch: "What a language model is, what it isn't, and why ChatGPT was the convergence of three decade-long research programs."
    lecture_topic: "From $n$-gram models to neural LMs · the language-modeling objective (next-token prediction) · perplexity · the convergence of the transformer + scale + RLHF · scaling laws (Kaplan 2020, Hoffmann 2022) · what 'capability' and 'alignment' mean."
    readings:
      - { ref: "Kaplan et al., *Scaling Laws for Neural Language Models* (2020)", url: "https://arxiv.org/abs/2001.08361" }
      - { ref: "Hoffmann et al., *Training Compute-Optimal Large Language Models* (NeurIPS 2022, the Chinchilla paper)", url: "https://arxiv.org/abs/2203.15556" }

  - number: "02"
    title: "The Transformer Architecture"
    pitch: "Vaswani et al. 2017 in eight pages — and what every successor since has changed about it."
    lecture_topic: "Attention as a content-addressable lookup · multi-head attention · positional encodings (absolute, RoPE, ALiBi) · encoder-decoder vs decoder-only vs encoder-only · the quadratic-in-sequence-length problem · FlashAttention and its descendants."
    readings:
      - { ref: "Vaswani et al., *Attention Is All You Need* (NeurIPS 2017)", url: "https://arxiv.org/abs/1706.03762" }
    code_lab:
      title: "Lab 1 — Implement a small transformer from scratch"
      task: "Implement a 4-layer decoder-only transformer in pure PyTorch (no `nn.Transformer`). Train on TinyStories or a Shakespeare corpus. Generate samples."
      notebook: "lab01-mini-transformer.ipynb"
      dataset: "TinyStories or Shakespeare corpus."

  - number: "03"
    title: "GPT and Text Generation"
    pitch: "The GPT family — from GPT-1's 117M parameters in 2018 to today's trillion-parameter models — and the engineering of inference."
    lecture_topic: "The decoder-only transformer in detail · training objectives (causal LM, MLM, span infilling) · sampling strategies (temperature, top-$k$, top-$p$, beam search) · KV cache · speculative decoding · batched inference."
    readings:
      - { ref: "Radford et al., *Improving Language Understanding by Generative Pre-Training* (OpenAI 2018, GPT-1)", url: "https://cdn.openai.com/research-covers/language-unsupervised/language_understanding_paper.pdf" }
      - { ref: "Brown et al., *Language Models are Few-Shot Learners* (NeurIPS 2020, GPT-3)", url: "https://arxiv.org/abs/2005.14165" }
    code_lab:
      title: "Lab 2 — Sampling strategy analysis"
      task: "On a 1B-parameter open model (e.g., Pythia-1B), generate the same prompt with five sampling strategies. Quantify diversity, coherence, factuality with simple metrics."
      notebook: "lab02-sampling.ipynb"
      dataset: "—"

  - number: "04"
    title: "Prompt Engineering"
    pitch: "The prompt as a programming surface. The standard patterns, the diagnostic techniques for failing prompts, and the management practices that survive production."
    lecture_topic: "In-context learning (Brown et al. 2020) · zero-shot, few-shot, chain-of-thought (Wei et al. 2022) · ReAct (Yao et al. 2022) · tree-of-thoughts · structured output (JSON mode, function calling) · prompt-template management for production."
    readings:
      - { ref: "Wei et al., *Chain-of-Thought Prompting Elicits Reasoning in Large Language Models* (NeurIPS 2022)", url: "https://arxiv.org/abs/2201.11903" }
    discussion:
      paper: "Yao et al., *ReAct: Synergizing Reasoning and Acting in Language Models* (ICLR 2023)"
      url: "https://arxiv.org/abs/2210.03629"
      prompts:
        - "What does ReAct buy that pure chain-of-thought doesn't?"
        - "When does ReAct fail?"

  - number: "05"
    title: "Fine-Tuning LLMs"
    pitch: "Adapting a pretrained model to a domain or a task. LoRA, QLoRA, and the parameter-efficient fine-tuning revolution."
    lecture_topic: "Full fine-tuning · LoRA (Hu et al. 2021) and QLoRA (Dettmers et al. 2023) · adapters and prefix-tuning · instruction tuning · RLHF (Christiano 2017 → Ouyang 2022) · DPO (Rafailov 2023) · the dataset engineering behind quality fine-tunes."
    readings:
      - { ref: "Hu et al., *LoRA: Low-Rank Adaptation of Large Language Models* (ICLR 2022)", url: "https://arxiv.org/abs/2106.09685" }
    code_lab:
      title: "Lab 3 — LoRA fine-tune a small open model"
      task: "Fine-tune Mistral-7B (or Llama-3.1-8B) with LoRA on a domain dataset. Compare zero-shot vs fine-tuned performance on a 50-example task-specific eval."
      notebook: "lab03-lora.ipynb"
      dataset: "Choose from a pre-curated set (medical Q&A, African-language instructions, code Q&A)."

  - number: "06"
    title: "Retrieval-Augmented Generation"
    pitch: "Don't make the model memorize everything — let it look things up. The dominant production pattern for grounded LLM applications."
    lecture_topic: "The RAG architecture (Lewis et al. 2020) · chunking strategies · embedding models (dense, sparse, hybrid) · vector databases (FAISS, Chroma, Qdrant, Pinecone) · reranking · prompt assembly · evaluation (faithfulness, context relevance, answer correctness)."
    readings:
      - { ref: "Lewis et al., *Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks* (NeurIPS 2020)", url: "https://arxiv.org/abs/2005.11401" }
    code_lab:
      title: "Lab 4 — RAG over a domain corpus"
      task: "Index a set of public domain documents (WHO/AFRO reports, scientific papers, course PDFs) in Chroma. Build retrieval + reranking + generation. Evaluate on a 30-question held-out set."
      notebook: "lab04-rag.ipynb"
      dataset: "Curated public PDFs (provided)."

  - number: "07"
    title: "Diffusion Models and Image Generation"
    pitch: "From DDPM (2020) to Stable Diffusion (2022) to the multimodal generative landscape of 2026."
    lecture_topic: "The forward and reverse diffusion processes · score-matching · DDPM, DDIM, ancestral sampling · classifier-free guidance · latent diffusion (Stable Diffusion) · ControlNet, LoRA for diffusion · image-to-image, video-from-image · evaluation (FID, CLIP-score, human eval)."
    readings:
      - { ref: "Ho, Jain, Abbeel, *Denoising Diffusion Probabilistic Models* (NeurIPS 2020)", url: "https://arxiv.org/abs/2006.11239" }
      - { ref: "Rombach et al., *High-Resolution Image Synthesis with Latent Diffusion Models* (CVPR 2022, the Stable Diffusion paper)", url: "https://arxiv.org/abs/2112.10752" }
    discussion:
      paper: "Song et al., *Score-Based Generative Modeling through Stochastic Differential Equations* (ICLR 2021)"
      url: "https://arxiv.org/abs/2011.13456"
      prompts:
        - "Why is the SDE framing more general than the discrete-time formulation?"
        - "What does the unification with score matching give you that DDPM alone doesn't?"

  - number: "08"
    title: "Evaluation, Safety, and Alignment"
    pitch: "How do you know your generative model is actually good? Spoiler: we don't entirely."
    lecture_topic: "Capability benchmarks (MMLU, HumanEval, GSM8K, HELM) · safety benchmarks (TruthfulQA, BBQ, RealToxicityPrompts) · LLM-as-judge · human eval methodology · red-teaming · the alignment problem at survey level (RLHF, constitutional AI, debate, scalable oversight)."
    readings:
      - { ref: "Lin et al., *TruthfulQA: Measuring How Models Mimic Human Falsehoods* (ACL 2022)", url: "https://arxiv.org/abs/2109.07958" }
    discussion:
      paper: "Bai et al., *Constitutional AI: Harmlessness from AI Feedback* (Anthropic 2022)"
      url: "https://arxiv.org/abs/2212.08073"
      prompts:
        - "Does constitutional AI replace RLHF or supplement it?"
        - "What's the right benchmark for harmlessness in 2026?"

  - number: "09"
    title: "LLM Agents and Tool Use"
    pitch: "The model as an orchestrator: it plans, calls tools, observes results, iterates."
    lecture_topic: "The agent design space · function calling and structured output · single-step vs multi-step vs hierarchical planning · multi-agent orchestration · memory architectures (short-term, long-term, episodic) · production engineering (rate limits, retries, observability, cost control)."
    readings:
      - { ref: "Anthropic, *Building effective agents* (engineering blog 2024)", url: "https://www.anthropic.com/engineering/building-effective-agents" }
    discussion:
      paper: "Park et al., *Generative Agents: Interactive Simulacra of Human Behavior* (UIST 2023)"
      url: "https://arxiv.org/abs/2304.03442"
      prompts:
        - "What does the Park et al. setup actually demonstrate beyond a curiosity?"
        - "What would a real-world agent application that worked look like?"

  - number: "10"
    title: "Final capstone — build and deploy a generative system"
    pitch: "Each participant ships a RAG system, a fine-tuned domain model, or a multi-step agent. Live demo. Public repository. Technical writeup."
    lecture_topic: "Final capstone presentations (15 min each + 5 min Q&A)."
    readings: []
