course:
  slug: "apprentissage-geometrique"
  title: "Geometric Deep Learning"
  short_title: "Geom DL"
  level: "Graduate"
  pitch: "Neural networks that respect the symmetries of their input domain — translation, rotation, permutation, graph structure. The mathematical thesis that ties GNNs, equivariant networks, and AlphaFold together."
  meeting_pattern: "Tuesdays 14:00–16:00 lecture · Thursdays 14:00–15:00 paper discussion (Africa/Lagos UTC+1)"
  prerequisites: "Linear algebra and multivariable calculus. Basic deep learning (forward pass, backprop). Familiarity with PyTorch. No prior group theory required — week 2 builds it from scratch."
  grading: "Four problem sets (40%) · three code labs (25%) · paper-discussion recitations (10%) · final project (25%)."
  notes_pdf: "/courses/apprentissage-geometrique/en/notes.pdf"
  notes_pdf_fr: "/courses/apprentissage-geometrique/fr/cours.pdf"
  textbook: "Bronstein, Bruna, Cohen, Veličković, *Geometric Deep Learning: Grids, Groups, Graphs, Geodesics, and Gauges* (2021) — recommended companion."
  instructor: "Dr. Yaé Ulrich Gaba"

defaults:
  pset_due: "Sunday 23:59"
  pset_submission: "Pull request on the cohort GitHub repository."
  recitation: "Thursday 14:00 (Africa/Lagos)"

weeks:
  - number: "01"
    title: "Motivations — Why Geometry in Deep Learning"
    pitch: "AlphaFold, AlphaGo, equivariant molecular models — none works without geometry-aware architecture. The unifying thesis of geometric deep learning, due to Bronstein et al. 2021."
    lecture_topic: "Felix Klein's 1872 Erlangen Program · the Bronstein-et-al. unifying thesis (2021) · the five geometric priors (translation, rotation, permutation, gauge, scale) · why a CNN works and why an MLP-on-flattened-pixels doesn't."
    readings:
      - { ref: "Bronstein, Bruna, Cohen, Veličković, *Geometric Deep Learning: Grids, Groups, Graphs, Geodesics, and Gauges* (proto-book, 2021)", url: "https://arxiv.org/abs/2104.13478" }

  - number: "02"
    title: "Group Theory for Deep Learning"
    pitch: "The minimum group theory you need to read modern equivariance papers, built from the ground up."
    lecture_topic: "Groups, subgroups, normal subgroups · group actions · representations and irreducibles · the symmetric, cyclic, dihedral, $SO(n)$, and $SE(n)$ groups · why these are the ones that matter for ML."
    readings:
      - { ref: "Cohen and Welling, *Group Equivariant Convolutional Networks* (ICML 2016, sections 1–3)", url: "https://arxiv.org/abs/1602.07576" }
    problem_set:
      title: "PS1 — Group fundamentals"
      problems:
        - "Compute all subgroups of $D_4$ (dihedral group of the square)."
        - "Show that the rotation group $SO(2)$ has a single irreducible non-trivial representation in each dimension."
        - "Implement the regular representation of $C_n$ as a permutation matrix."

  - number: "03"
    title: "Graph Neural Networks"
    pitch: "Message passing as the core operation. Why GNNs are permutation-equivariant by construction."
    lecture_topic: "Message-passing framework (Gilmer et al. 2017) · update / aggregate / readout · permutation equivariance and invariance · graph convolution as a special case · the canonical layer."
    readings:
      - { ref: "Gilmer et al., *Neural Message Passing for Quantum Chemistry* (ICML 2017)", url: "https://arxiv.org/abs/1704.01212" }
    code_lab:
      title: "Your first GNN"
      task: "Train a 2-layer GCN on the Cora citation network using PyTorch Geometric. Compare against a logistic-regression baseline."
      notebook: "lab01-gnn-cora.ipynb"
      dataset: "Cora (citation network, public)."

  - number: "04"
    title: "GNN Variants — GAT, GIN, GraphSAGE"
    pitch: "The expressive-power hierarchy and the design choices that drive it."
    lecture_topic: "Graph attention (Veličković et al. 2018) · GraphSAGE (Hamilton et al. 2017) · graph isomorphism networks and the Weisfeiler-Lehman connection (Xu et al. 2019) · what each variant fixes about plain GCN."
    readings:
      - { ref: "Veličković et al., *Graph Attention Networks* (ICLR 2018)", url: "https://arxiv.org/abs/1710.10903" }
      - { ref: "Xu et al., *How Powerful are Graph Neural Networks?* (ICLR 2019)", url: "https://arxiv.org/abs/1810.00826" }
    problem_set:
      title: "PS2 — Expressive power"
      problems:
        - "Prove that GIN is at most as powerful as the 1-WL test."
        - "Construct two non-isomorphic graphs that no message-passing GNN can distinguish."

  - number: "05"
    title: "Spectral Graph Learning"
    pitch: "Convolution on graphs via the graph Laplacian. Why ChebNet matters and why most modern GNNs went back to spatial methods."
    lecture_topic: "The graph Laplacian and its spectrum · spectral filters · ChebNet (Defferrard 2016) · GCN (Kipf-Welling 2017) as a degenerate ChebNet · spectral methods on signed and directed graphs."
    readings:
      - { ref: "Defferrard, Bresson, Vandergheynst, *Convolutional Neural Networks on Graphs with Fast Localized Spectral Filtering* (NeurIPS 2016)", url: "https://arxiv.org/abs/1606.09375" }
    discussion:
      paper: "Kipf, Welling, *Semi-Supervised Classification with Graph Convolutional Networks* (ICLR 2017)"
      url: "https://arxiv.org/abs/1609.02907"
      prompts:
        - "Is GCN really a spectral method or a spatial one in disguise?"
        - "What does the simplification cost in terms of expressive power?"

  - number: "06"
    title: "Learning on Manifolds"
    pitch: "Molecular structures, brain scans, single-cell embeddings — data that lives on curved surfaces where Euclidean distance lies. Manifold-aware learning is the fix."
    lecture_topic: "Riemannian manifolds at a working level · the exponential and logarithmic maps · tangent-space methods · geodesic distance vs Euclidean · hyperbolic embeddings (Nickel-Kiela 2017)."
    readings:
      - { ref: "Nickel and Kiela, *Poincaré Embeddings for Learning Hierarchical Representations* (NeurIPS 2017)", url: "https://arxiv.org/abs/1705.08039" }
    code_lab:
      title: "Hyperbolic embedding of a taxonomy"
      task: "Embed WordNet's mammal subtree in 2-D Euclidean and 2-D Poincaré-ball space. Compare nearest-neighbor structure."
      notebook: "lab02-hyperbolic.ipynb"
      dataset: "WordNet (NLTK)."

  - number: "07"
    title: "Equivariant and Invariant Networks"
    pitch: "Building neural networks that commute with group actions. The cleanest case of design-by-symmetry in modern ML."
    lecture_topic: "Equivariance vs invariance · steerable kernels · $SE(3)$-transformers (Fuchs et al. 2020) · E(n)-equivariant graph neural networks (Satorras et al. 2021) · symmetry-aware molecular property prediction."
    readings:
      - { ref: "Satorras, Hoogeboom, Welling, *E(n) Equivariant Graph Neural Networks* (ICML 2021)", url: "https://arxiv.org/abs/2102.09844" }
    problem_set:
      title: "PS3 — Equivariance proofs"
      problems:
        - "Prove that the standard CNN is equivariant to integer translations but not to general rotations."
        - "Show that the E(n)-GNN of Satorras et al. is E(n)-equivariant by construction."

  - number: "08"
    title: "Point Cloud Representations"
    pitch: "Three architectures for unordered sets of 3D points: PointNet, PointNet++, and EquivariantConv."
    lecture_topic: "Point clouds as permutation-invariant inputs · PointNet (Qi et al. 2017) and its critical-point analysis · PointNet++ as hierarchical PointNet · DGCNN (Wang et al. 2019) · current LiDAR / point-cloud benchmarks."
    readings:
      - { ref: "Qi et al., *PointNet: Deep Learning on Point Sets for 3D Classification and Segmentation* (CVPR 2017)", url: "https://arxiv.org/abs/1612.00593" }
    code_lab:
      title: "PointNet on ModelNet10"
      task: "Train a PointNet for 3D shape classification on ModelNet10. Evaluate equivariance breakage by rotating test inputs."
      notebook: "lab03-pointnet.ipynb"
      dataset: "ModelNet10 (Princeton)."

  - number: "09"
    title: "Applications"
    pitch: "Three case studies: AlphaFold, drug discovery, autonomous-driving perception."
    lecture_topic: "AlphaFold 2 / 3 architecture overview · molecular property prediction at scale (Open Catalyst Project, MACE) · point-cloud perception for autonomous driving · molecular generative models."
    readings:
      - { ref: "Jumper et al., *Highly accurate protein structure prediction with AlphaFold* (Nature 2021)", url: "https://www.nature.com/articles/s41586-021-03819-2" }
    discussion:
      paper: "Batatia et al., *MACE: Higher Order Equivariant Message Passing Neural Networks for Fast and Accurate Force Fields* (NeurIPS 2022)"
      url: "https://arxiv.org/abs/2206.07697"
      prompts:
        - "Where does the speed advantage of MACE over DFT come from?"
        - "What's the right benchmark for force-field accuracy in 2026?"

  - number: "10"
    title: "Connections to TDA"
    pitch: "Topological data analysis and geometric deep learning are coming together. What each side brings to the other."
    lecture_topic: "Persistent homology as a differentiable layer · topology-aware GNNs · sheaf neural networks (Bodnar et al. 2022) · topological message passing · open mathematical problems."
    readings:
      - { ref: "Bodnar et al., *Neural Sheaf Diffusion: A Topological Perspective on Heterophily and Oversmoothing in GNNs* (NeurIPS 2022)", url: "https://arxiv.org/abs/2202.04579" }
    discussion:
      paper: "Horn et al., *Topological Graph Neural Networks* (ICLR 2022)"
      url: "https://arxiv.org/abs/2102.07835"
      prompts:
        - "Does the topological prior demonstrably help on benchmarks where standard GNNs fail?"
        - "How much of the gain is the topology and how much is the auxiliary signal?"

  - number: "11"
    title: "Current Research Directions"
    pitch: "Where the field is heading: scale, expressivity, foundations."
    lecture_topic: "Scaling laws for GNNs · the over-smoothing and over-squashing problems · positional encodings on graphs · graph transformers · the geometric foundation models question."
    readings:
      - { ref: "Rampášek et al., *Recipe for a General, Powerful, Scalable Graph Transformer* (NeurIPS 2022)", url: "https://arxiv.org/abs/2205.12454" }
    discussion:
      paper: "Tönshoff et al., *Where Did the Gap Go? Reassessing the Long-Range Graph Benchmark* (2023)"
      url: "https://arxiv.org/abs/2309.00367"
      prompts:
        - "Are claimed long-range gains real or evaluation artifacts?"

  - number: "12"
    title: "Final project presentations"
    pitch: "Each participant presents a geometric deep-learning system applied to a dataset of their choice."
    lecture_topic: "Final project presentations (15 min each + 5 min Q&A)."
    readings: []
