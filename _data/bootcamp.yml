# Bootcamp single source of truth.
# Per-cohort dates and links override the defaults inline in each week entry.

defaults:
  timezone: "Africa/Lagos (UTC+1)"
  channel_pattern: "#cohort-week-NN"
  weekly_cadence:
    - { day: Mon, time: "09:00-12:00", kind: live, block: "Live instruction + code-along" }
    - { day: Mon, time: "14:00-16:00", kind: lab,  block: "Independent lab work + TA office hours" }
    - { day: Tue, time: "09:00-12:00", kind: live, block: "Live instruction + code-along" }
    - { day: Tue, time: "14:00-16:00", kind: lab,  block: "Independent lab work + TA office hours" }
    - { day: Wed, time: "09:00-12:00", kind: live, block: "Live instruction + code-along" }
    - { day: Wed, time: "14:00-16:00", kind: lab,  block: "Independent lab work + TA office hours" }
    - { day: Thu, time: "09:00-12:00", kind: live, block: "Live instruction + code-along" }
    - { day: Thu, time: "14:00-16:00", kind: lab,  block: "Independent lab work + TA office hours" }
    - { day: Fri, time: "10:00-11:00", kind: guest, block: "Industry speaker" }
    - { day: Fri, time: "11:30-12:30", kind: review, block: "Lab review" }
    - { day: Fri, time: "14:00-15:00", kind: retro, block: "Cohort retrospective" }
  default_deliverable_due: "Friday 18:00"
  default_submission: "Drop the repo URL into the week's cohort channel. Peer-review pairing announced Monday of next week."
  default_rubric: "Pass / revise. Pass requires green CI, tests covering the public API, and a README a stranger can follow to install and run the code."

weeks:

  - number: "01"
    module: M1
    title: "Python for data work"
    pitch: "Take the Python you already half-know and make it precise enough to ship."
    deliverable: |
      Public GitHub repo with the cleaned-up Lab-1 refactor: `README.md`, `pyproject.toml`, working `pytest` suite, CI passing on a single push.
    learning_outcomes:
      - "Write idiomatic Python --- comprehensions, generators, context managers, decorators."
      - "Use NumPy and Pandas fluently for vectorized data manipulation."
      - "Build a reproducible Python project (virtualenv, `pyproject.toml`, pre-commit, basic testing)."
      - "Read, modify, and write Jupyter notebooks without losing reproducibility."
    topics: "Data types and control flow · functions, scoping, closures · classes and protocols · NumPy arrays, broadcasting, indexing · Pandas Series and DataFrames, joins, group-by, reshape · matplotlib and seaborn for plotting · virtual environments and dependency management · Git basics for code and notebooks."
    labs:
      - title: "Refactor the 300-line script"
        task: "A deliberately ugly `messy_data_pipeline.py` is provided. Refactor into a typed `src/` package with `pytest` coverage that catches the two latent bugs, a `pyproject.toml`, a `README.md`, and a passing GitHub Actions workflow."
        dataset: "Kenya Health Facilities Registry, December 2024 export (~12,000 facilities)"
      - title: "Pandas wrangling on real data"
        task: "From raw Kenya health-facility data, produce an analytical DataFrame answering three questions: public vs private share by county, underserved areas by population per facility, and whether weighting by facility capacity changes the picture."
        dataset: "Same dataset as Lab 1, with population overlays."
      - title: "Publish your project"
        task: "Push the refactored Lab 1 package to a public GitHub repo with a release tag, a versioned `pyproject.toml`, and a CI badge. Add it to your bootcamp profile."
        dataset: "—"
    readings:
      mandatory:
        - { before: "Tuesday", ref: "Hitchhiker's Guide to Python: \"Writing great Python code\" chapters (skim)", url: "https://docs.python-guide.org/" }
        - { before: "Wednesday", ref: "Wes McKinney, *Python for Data Analysis* (3rd ed., 2022), chapters 4-5", url: "https://wesmckinney.com/book/" }
        - { before: "Thursday", ref: "*Python for Data Analysis* chapters 8 and 10", url: "https://wesmckinney.com/book/" }
      optional:
        - { ref: "Luciano Ramalho, *Fluent Python* (2nd ed., 2022), chapters 17-18 and 24", note: "For participants who already know Pandas well." }
    catalogue:
      - { slug: "programmation-scientifiques", label: "Programmation Scientifique" }
      - { slug: "intro-data-science", label: "Introduction to Data Science" }

  - number: "02"
    module: M2
    title: "Introduction to machine learning"
    pitch: "What ML actually is, what it isn't, and the workflow that runs underneath every project."
    deliverable: |
      Notebook + 600-word writeup: a clean train/validation/test pipeline on a real hospital dataset, with calibration analysis and an explicit leakage audit.
    learning_outcomes:
      - "Frame a problem as supervised, unsupervised, or reinforcement learning --- and recognize when none of these is the right framing."
      - "Build a clean train/validation/test pipeline that avoids leakage."
      - "Choose, fit, and evaluate a simple model on a real dataset."
      - "Read a learning curve and a confusion matrix without confusing yourself."
    topics: "The supervised learning loop · loss functions and risk · empirical risk minimization · bias-variance · cross-validation, train/val/test splits, leakage · evaluation metrics for classification and regression · the *no free lunch* perspective on model choice."
    labs:
      - title: "Patient readmission prediction"
        task: "Build a logistic-regression pipeline predicting 30-day readmission. Evaluate not just by AUC but by Brier calibration and reliability diagram."
        dataset: "MIMIC-IV demo (a clean 1{,}000-patient excerpt redistributed with the bootcamp)."
      - title: "Diagnose the broken evaluation"
        task: "A notebook is supplied with three deliberate leakage points and two metric-misuse traps. Find them, fix them, and write a 200-word memo explaining each."
        dataset: "Synthetic, supplied."
    readings:
      mandatory:
        - { before: "Tuesday", ref: "Hastie, Tibshirani, Friedman, *The Elements of Statistical Learning*, chapter 7 (sections 7.1-7.4)", url: "https://hastie.su.domains/ElemStatLearn/" }
        - { before: "Wednesday", ref: "Andrew Ng, *Machine Learning Yearning*, chapters on dev/test splits and bias-variance", url: "https://www.mlyearning.org/" }
      optional:
        - { ref: "Sebastian Raschka, *Model Evaluation, Model Selection, and Algorithm Selection in Machine Learning* (arXiv:1811.12808)", note: "Comprehensive review of CV variants and significance tests." }
    catalogue:
      - { slug: "apprentissage-automatique", label: "Fondements de l'Apprentissage Automatique" }
      - { slug: "intro-data-science", label: "Introduction to Data Science" }

  - number: "03"
    module: M3
    title: "Classical ML --- regression, classification, clustering"
    pitch: "The pre-deep-learning toolkit. Still the right answer for most tabular problems."
    deliverable: |
      Credit-scoring pipeline on an African bank dataset, with EDA notebook, model comparison (logistic + XGBoost), calibration, fairness audit across at least two demographic slices, and a deployable scoring function.
    learning_outcomes:
      - "Fit and tune linear and regularized regression (ridge, lasso, elastic net)."
      - "Build and interpret tree-based ensembles (random forests, gradient boosting)."
      - "Apply unsupervised methods (k-means, hierarchical, DBSCAN, GMMs, PCA, UMAP)."
      - "Diagnose feature importance and partial dependence honestly, without overclaiming causality."
    topics: "Linear and logistic regression · regularization (ridge, lasso, elastic net) · SVMs and the kernel trick · decision trees, random forests, gradient boosting (XGBoost, LightGBM) · clustering (k-means, hierarchical, DBSCAN, GMM) · dimensionality reduction (PCA, UMAP, t-SNE) · model interpretation (permutation importance, SHAP, partial dependence) · what these methods can and cannot tell you about causation."
    labs:
      - title: "Credit scoring with fairness audit"
        task: "Full pipeline from EDA to deployable scoring function on a Kaggle African-bank dataset. Compare logistic baseline against XGBoost. Audit calibration and group fairness across at least two demographic slices."
        dataset: "Kaggle: *Bank loan default prediction* (Cameroon subset)."
      - title: "Customer segmentation"
        task: "Cluster customers by mobile-money transaction patterns. Justify $k$, characterize each cluster, write a 300-word memo for a non-technical product manager."
        dataset: "Public anonymized mobile-money transaction sample (Orange/MTN open-data initiative)."
      - title: "SHAP interpretation --- and its failure modes"
        task: "SHAP-explain the XGBoost model from Lab 1. Then deliberately construct three cases where SHAP gives misleading explanations and document them."
        dataset: "Same as Lab 1."
    readings:
      mandatory:
        - { before: "Tuesday", ref: "Hastie, Tibshirani, Friedman, *ESL*, chapters 3 (linear), 9 (trees), 10 (boosting)", url: "https://hastie.su.domains/ElemStatLearn/" }
        - { before: "Wednesday", ref: "Christoph Molnar, *Interpretable Machine Learning*, chapters 5 (SHAP) and 8 (limitations)", url: "https://christophm.github.io/interpretable-ml-book/" }
      optional:
        - { ref: "Tianqi Chen and Carlos Guestrin, *XGBoost: A Scalable Tree Boosting System* (KDD 2016)", url: "https://arxiv.org/abs/1603.02754" }
        - { ref: "Cynthia Rudin, *Stop Explaining Black Box Machine Learning Models for High Stakes Decisions* (Nature Machine Intelligence 2019)", url: "https://www.nature.com/articles/s42256-019-0048-x" }
    catalogue:
      - { slug: "apprentissage-automatique", label: "Fondements de l'Apprentissage Automatique" }

  - number: "04"
    module: M4
    title: "Recommender systems"
    pitch: "How Netflix-style systems actually work, and the honest evaluation problem they create."
    deliverable: |
      Hybrid recommender on a real e-commerce dataset, evaluated against three offline metrics with an explicit discussion of why they disagree.
    learning_outcomes:
      - "Implement collaborative filtering (user-based, item-based, matrix factorization)."
      - "Implement content-based filtering with embeddings."
      - "Build a hybrid recommender and evaluate with offline metrics (precision@k, NDCG, MAP)."
      - "Understand why offline metrics often disagree with online A/B results."
    topics: "The recommendation problem · explicit vs implicit feedback · collaborative filtering · matrix factorization (SVD, ALS, NMF) · content-based filtering with embeddings · hybrid models · evaluation: precision@k, recall@k, NDCG, MAP, online vs offline metrics · cold-start, popularity bias, filter bubbles · the *you'll never know until you A/B test* problem."
    labs:
      - title: "MovieLens collaborative filter"
        task: "Build a user-item matrix factorization on MovieLens 1M, first with raw SVD then with ALS. Compare RMSE on held-out ratings."
        dataset: "MovieLens 1M (GroupLens)."
      - title: "Hybrid e-commerce recommender"
        task: "Combine collaborative + content-based + popularity baselines on a public e-commerce dataset. Tune the blending weights against precision@10."
        dataset: "Olist Brazilian e-commerce public dataset (Kaggle)."
      - title: "Three metrics, three rankings"
        task: "Take three candidate recommenders from Labs 1 and 2. Evaluate against precision@10, NDCG@10, and MAP@10. Write a 400-word memo explaining why they rank the models differently."
        dataset: "Same as Labs 1 and 2."
    readings:
      mandatory:
        - { before: "Tuesday", ref: "Aggarwal, *Recommender Systems Textbook*, chapters 1-3 (neighborhood and model-based methods)", url: "https://link.springer.com/book/10.1007/978-3-319-29659-3" }
        - { before: "Wednesday", ref: "Koren, Bell, Volinsky, *Matrix Factorization Techniques for Recommender Systems* (IEEE Computer 2009)", url: "https://datajobs.com/data-science-repo/Recommender-Systems-[Netflix].pdf" }
      optional:
        - { ref: "Maurizio Ferrari Dacrema et al., *Are We Really Making Much Progress? A Worrying Analysis of Recent Neural Recommendation Approaches* (RecSys 2019)", url: "https://arxiv.org/abs/1907.06902" }
    catalogue: []

  - number: "05"
    module: M5
    title: "Natural language processing"
    pitch: "From the linguistics-aware classical methods to the transformer-era pipeline."
    deliverable: |
      Three-deliverable pack: a sentiment classifier (logistic baseline + DistilBERT), an NER tagger on a multilingual dataset including an African language, and a fine-tuned summarization model.
    learning_outcomes:
      - "Build a working text classification pipeline (cleaning, tokenization, vectorization, training, evaluation)."
      - "Fine-tune a pretrained transformer on a domain-specific task."
      - "Apply NLP to a multilingual or low-resource setting (with attention to African languages)."
      - "Understand the limitations: hallucination, bias, evaluation difficulty."
    topics: "Text preprocessing and tokenization (BPE, WordPiece) · word embeddings (Word2Vec, GloVe, FastText) · sequence models (RNN, LSTM, GRU) · the Transformer architecture · BERT-family models and fine-tuning · NER, sentiment, classification, summarization · multilingual and low-resource NLP · evaluation: BLEU, ROUGE, exact match, human evaluation."
    labs:
      - title: "Sentiment from baseline to BERT"
        task: "Two pipelines on the same customer-review corpus: a TF-IDF + logistic baseline and a fine-tuned DistilBERT. Report accuracy, macro F1, and the per-class confusion matrix."
        dataset: "Amazon multilingual reviews (HuggingFace `amazon_reviews_multi`, with French and English splits)."
      - title: "Multilingual NER"
        task: "Train a token-classification head on a multilingual dataset that includes at least one African language. Report per-language F1."
        dataset: "MasakhaNER 2.0 (Wolof, Yoruba, Swahili, Hausa, plus French and English)."
      - title: "Fine-tuned summarization"
        task: "Fine-tune a T5-base or BART-base on a news-summarization corpus. Evaluate by ROUGE-L *and* by a 50-example human-eval rubric you design."
        dataset: "XSum or CNN/DailyMail (English baseline)."
    readings:
      mandatory:
        - { before: "Tuesday", ref: "Jurafsky and Martin, *Speech and Language Processing* (3rd draft), chapters 6-9 (vector semantics, neural LMs, RNN, transformer)", url: "https://web.stanford.edu/~jurafsky/slp3/" }
        - { before: "Wednesday", ref: "Vaswani et al., *Attention Is All You Need* (NeurIPS 2017)", url: "https://arxiv.org/abs/1706.03762" }
        - { before: "Thursday", ref: "HuggingFace NLP Course, chapters 1-3 (fine-tuning a pretrained model)", url: "https://huggingface.co/learn/nlp-course" }
      optional:
        - { ref: "MasakhaNLP project: papers and datasets for African languages", url: "https://www.masakhane.io/" }
    catalogue:
      - { slug: "tal-nlp", label: "Traitement Automatique du Langage" }

  - number: "06"
    module: M6
    title: "Modern ML --- ANN, CNN, RNN"
    pitch: "Deep learning end-to-end, with enough theory to know when *not* to use it."
    deliverable: |
      Three small deliverables: a 2-layer MLP from scratch in NumPy then ported to PyTorch, a CNN trained on a medical-imaging dataset, and an LSTM for sequence prediction on a financial time series.
    learning_outcomes:
      - "Train a feed-forward neural network from scratch in NumPy, then in PyTorch."
      - "Build, train, and evaluate CNNs on image classification tasks."
      - "Build, train, and evaluate RNNs/LSTMs on sequence tasks."
      - "Diagnose training pathologies: vanishing gradients, overfitting, dead neurons, distribution shift."
    topics: "Feed-forward networks, backpropagation, optimization (SGD, Adam, AdamW) · regularization (dropout, batch norm, weight decay, early stopping) · CNNs (LeNet, AlexNet, ResNet, modern architectures) · RNNs, LSTMs, GRUs · attention as a primitive · representation learning · the bitter lessons of deep learning (compute scaling, what doesn't transfer)."
    labs:
      - title: "MLP from scratch then PyTorch"
        task: "Implement a 2-layer MLP with manual backprop in NumPy. Get it training on MNIST. Then port to PyTorch and verify identical loss curves (to within stochastic noise)."
        dataset: "MNIST (canonical)."
      - title: "Medical-imaging CNN with dataset audit"
        task: "Train a ResNet18 on a public chest-X-ray dataset. Then conduct a dataset-bias audit: does the model exploit hospital-specific artifacts? Write a 400-word memo on what you find."
        dataset: "NIH ChestX-ray14 (small subset) + a second hospital's images for out-of-distribution test."
      - title: "LSTM for financial time series"
        task: "Predict 10-day-ahead returns on a multi-asset basket. Compare LSTM against a baseline AR(1) and a naive last-value predictor. Report the embarrassing gap, then explain why time-series prediction is harder than it looks."
        dataset: "Yahoo Finance daily closes for a 10-ticker basket, 2010-2024."
    readings:
      mandatory:
        - { before: "Tuesday", ref: "Goodfellow, Bengio, Courville, *Deep Learning*, chapters 6-8 (feed-forward, regularization, optimization)", url: "https://www.deeplearningbook.org/" }
        - { before: "Wednesday", ref: "fast.ai *Practical Deep Learning for Coders*, lessons 1-3", url: "https://course.fast.ai/" }
        - { before: "Thursday", ref: "He, Zhang, Ren, Sun, *Deep Residual Learning for Image Recognition* (CVPR 2016, the ResNet paper)", url: "https://arxiv.org/abs/1512.03385" }
      optional:
        - { ref: "Andrej Karpathy, *A Recipe for Training Neural Networks* (blog post 2019)", url: "http://karpathy.github.io/2019/04/25/recipe/" }
    catalogue:
      - { slug: "apprentissage-profond", label: "Apprentissage Profond" }

  - number: "07"
    module: M7
    title: "LLMs and generative AI"
    pitch: "What's under the hood of GPT/Claude/LLaMA, what you can actually do with them, and where they fail."
    deliverable: |
      Pick one of three tracks: a RAG system over a domain corpus, a LoRA fine-tune of a 1-7B-parameter model on a domain task, or a multi-step tool-using agent.
    learning_outcomes:
      - "Understand the transformer architecture as it appears in modern LLMs."
      - "Apply prompt engineering and structured-output techniques effectively."
      - "Fine-tune a small open-source LLM with LoRA/QLoRA on a domain dataset."
      - "Build a retrieval-augmented generation (RAG) system."
      - "Evaluate generation honestly: when an LLM is genuinely useful, when it is confabulating."
    topics: "The transformer, attention mechanism, scaling laws · pretraining, fine-tuning, RLHF/DPO at survey level · prompt engineering, structured output, function calling · parameter-efficient fine-tuning (LoRA, QLoRA, PEFT) · RAG: chunking, embedding, retrieval, reranking, generation · diffusion models (intuition + practical use) · evaluation: BLEU, ROUGE, LLM-as-judge, human eval, why all of these are partial · agentic systems and tool use · safety, alignment, hallucination, bias."
    labs:
      - title: "RAG over a domain corpus"
        task: "Index a set of WHO/AFRO health reports in ChromaDB. Build retrieval + reranking + grounded generation. Evaluate faithfulness, context relevance, and answer correctness on a 30-question held-out set."
        dataset: "WHO/AFRO PDF reports (open access)."
      - title: "LoRA fine-tune on a domain task"
        task: "Fine-tune Llama 3.1 8B or Mistral 7B with LoRA on a domain dataset (medical Q&A, legal contract review, or African-language instruction following). Report perplexity and a 50-example task-specific accuracy."
        dataset: "Choose one of three pre-curated splits."
      - title: "Multi-step tool-using agent"
        task: "Build an agent with LangGraph or function-calling that combines search, calculator, and code execution. Stress-test on 20 multi-step queries and document failure modes."
        dataset: "Synthetic + live web tools."
    readings:
      mandatory:
        - { before: "Tuesday", ref: "Vaswani et al., *Attention Is All You Need*", url: "https://arxiv.org/abs/1706.03762" }
        - { before: "Wednesday", ref: "Brown et al., *Language Models are Few-Shot Learners* (the GPT-3 paper, sections 1-3)", url: "https://arxiv.org/abs/2005.14165" }
        - { before: "Thursday", ref: "Lewis et al., *Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks*", url: "https://arxiv.org/abs/2005.11401" }
        - { before: "Friday", ref: "Hu et al., *LoRA: Low-Rank Adaptation of Large Language Models*", url: "https://arxiv.org/abs/2106.09685" }
      optional:
        - { ref: "Anthropic, *Building effective agents* (engineering blog 2024)", url: "https://www.anthropic.com/engineering/building-effective-agents" }
        - { ref: "Karpathy, *Let's build GPT: from scratch, in code, spelled out*", url: "https://www.youtube.com/watch?v=kCc8FmEb1nY" }
    catalogue:
      - { slug: "ia-generative", label: "IA Générative" }

  - number: "08"
    module: M8
    title: "MLOps and deployment"
    pitch: "What it takes for the model to keep working after the notebook is closed."
    deliverable: |
      A deployed model: trained model wrapped in a FastAPI service, containerized, deployed to a free-tier cloud, with MLflow tracking and a basic drift-monitoring dashboard.
    learning_outcomes:
      - "Version code, data, and models in a way that supports reproducibility."
      - "Containerize a model and deploy it as a REST API."
      - "Set up experiment tracking, model registry, and monitoring."
      - "Build a basic CI/CD pipeline for an ML system."
    topics: "Reproducibility (Git, DVC, MLflow) · experiment tracking and model registry (MLflow, Weights & Biases) · containerization (Docker, docker-compose) · serving (FastAPI, BentoML, model registries) · monitoring (data drift, prediction drift, performance drift, latency, cost) · CI/CD for ML pipelines · the difference between *the model works on my laptop* and *the model works in production for six months*."
    labs:
      - title: "FastAPI + Docker + free-tier deploy"
        task: "Wrap any trained model from a previous week in a FastAPI service. Containerize. Deploy to Render or Railway. Call the deployed endpoint from a fresh notebook."
        dataset: "Bring your own model from week 3, 6, or 7."
      - title: "MLflow tracking for a retraining loop"
        task: "Set up MLflow tracking for a model retraining loop. Log hyperparameters, metrics, artifacts. Promote a model from staging to production via the Model Registry."
        dataset: "Reuse one of the earlier weeks' datasets."
      - title: "Drift detection"
        task: "Simulate gradual data drift on a deployed model. Build a Grafana or Evidently dashboard that detects it. Wire an alert that fires on a PSI threshold."
        dataset: "Synthetic drift overlay on a previous week's data."
    readings:
      mandatory:
        - { before: "Tuesday", ref: "Sculley et al., *Hidden Technical Debt in Machine Learning Systems* (NeurIPS 2015)", url: "https://papers.nips.cc/paper/2015/hash/86df7dcfd896fcaf2674f757a2463eba-Abstract.html" }
        - { before: "Wednesday", ref: "Google Cloud, *MLOps: Continuous delivery and automation pipelines in machine learning*", url: "https://cloud.google.com/architecture/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning" }
        - { before: "Thursday", ref: "Chip Huyen, *Designing Machine Learning Systems* (O'Reilly 2022), chapters 7-9", url: "https://www.oreilly.com/library/view/designing-machine-learning/9781098107956/" }
      optional:
        - { ref: "MLOps community, *Awesome MLOps* (curated list)", url: "https://github.com/visenger/awesome-mlops" }
    catalogue:
      - { slug: "mlops", label: "MLOps" }

  - number: "09"
    module: "M9 + M10"
    title: "Capstone work-week + portfolio sessions"
    pitch: "Concentrated build week on the capstone, with daily check-ins and three portfolio-craft sessions."
    deliverable: |
      Capstone code freeze by Friday. Working deployed demo, complete README, half-drafted technical writeup. Plus a personal-website / portfolio skeleton published to GitHub Pages.
    learning_outcomes:
      - "Ship a working ML system end-to-end under a real deadline."
      - "Curate three to five projects from the bootcamp into a coherent portfolio."
      - "Write a project README an external reader can follow in five minutes."
      - "Publish notebooks and demos through nbviewer, Colab, HuggingFace Spaces, or GitHub Pages."
    topics: "Capstone build mechanics · code-freeze discipline · README craft · technical writing for ML projects · publishing notebooks and demos · what a hiring-manager-friendly portfolio actually looks like."
    labs:
      - title: "Capstone code freeze"
        task: "By Friday 18:00, the capstone code is on `main`, tagged `v0.9-codefreeze`, and the deployed demo is reachable. No new features after this point; only bug fixes and writeup."
        dataset: "Per capstone --- see the [capstone brief](CAPSTONE.md)."
      - title: "Portfolio skeleton"
        task: "Stand up a personal portfolio site on GitHub Pages. Three project cards minimum, each linking to a public repository, a short readme, and (where applicable) a hosted demo."
        dataset: "—"
      - title: "README rewrite"
        task: "Take the README of your favorite past lab (week 1 refactor, week 3 credit scoring, etc.). Rewrite it so a stranger can install, run, and understand the project in five minutes."
        dataset: "—"
    readings:
      mandatory:
        - { before: "Tuesday", ref: "Capstone brief (re-read)", url: "/workshops/ml-ai-bootcamp/CAPSTONE/" }
      optional:
        - { ref: "Lead instructor's data-science portfolio as one example", url: "https://gabayae.github.io/data-portfolio/" }
        - { ref: "Will Crichton, *Why Most Published Research Findings are False* applied to ML demos (blog post 2023)", url: "https://willcrichton.net/" }
    catalogue: []

  - number: "10"
    module: "M9 + M10"
    title: "Capstone wrap-up, final presentations, portfolio launch"
    pitch: "Show what you built, publish what you built, and walk out with a portfolio that says *I can actually do this*."
    deliverable: |
      Final capstone presentation (10 min talk + 5 min Q&A), public repository at `v1.0` tag, technical writeup published as a blog post or repo doc, portfolio site live with capstone listed prominently.
    learning_outcomes:
      - "Present a technical ML project to a mixed (technical + non-technical) audience."
      - "Publish a technical writeup of the capstone."
      - "Ship a portfolio that a hiring manager or collaborator can navigate in five minutes."
      - "Conduct a constructive peer review of two other capstones."
    topics: "Technical presentation craft · what a hiring manager scans for · live demo discipline (and what to do when it breaks) · peer-review etiquette · what to do after the bootcamp (job search, open-source contribution, advanced study)."
    labs:
      - title: "Final presentations day"
        task: "Each participant or team delivers a 10-minute talk + 5-minute Q&A. Industry-speaker panel reviews. Public recording (with consent)."
        dataset: "Per capstone."
      - title: "Portfolio launch"
        task: "Portfolio site published on GitHub Pages (or equivalent), submitted to the cohort showcase. Internal cross-promotion via mutual social-media tags is optional but encouraged."
        dataset: "—"
      - title: "Peer review of two capstones"
        task: "Read two other capstones end-to-end. Write a 300-word written review for each. Reviews are exchanged in a structured peer-review session on Friday."
        dataset: "Other cohort members' capstones."
    readings:
      mandatory:
        - { before: "Tuesday", ref: "Sample capstones from prior cohorts (linked in cohort channel)", url: "" }
      optional:
        - { ref: "Patrick Mineault, *The Good Research Code Handbook*", url: "https://goodresearch.dev/" }
    catalogue: []
