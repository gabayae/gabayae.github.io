course:
  slug: "apprentissage-automatique"
  title: "Foundations of Machine Learning"
  short_title: "ML"
  level: "Advanced undergraduate / early graduate"
  pitch: "The classical machine-learning toolkit — linear and tree-based methods, SVMs, ensembles, clustering, dimensionality reduction, Bayesian learning — with the statistical learning theory underneath."
  meeting_pattern: "Tuesdays + Thursdays, 14:00–16:00 lecture · Fridays 14:00–15:00 problem-set review (Africa/Lagos UTC+1)"
  prerequisites: "Linear algebra, calculus (gradients), undergraduate probability (random variables, expectation, conditional probability). Python at the level of writing and debugging a 200-line script."
  grading: "Six problem sets (45%) · four code labs (25%) · final project (30%)."
  notes_pdf: "/courses/apprentissage-automatique/en/notes.pdf"
  notes_pdf_fr: "/courses/apprentissage-automatique/fr/cours.pdf"
  textbook: "Hastie, Tibshirani, Friedman, *The Elements of Statistical Learning* (2nd ed.) — required reference. Murphy, *Probabilistic Machine Learning* — companion."
  instructor: "Dr. Yaé Ulrich Gaba"

defaults:
  pset_due: "Sunday 23:59"
  pset_submission: "Pull request on the cohort GitHub repository."
  recitation: "Friday 14:00 (Africa/Lagos)"

weeks:
  - number: "01"
    title: "Introduction to Machine Learning"
    pitch: "Arthur Samuel's 1959 checkers program: the program plays, the program improves, the code doesn't change. Sixty-five years later, every spam filter, credit scorer, and MRI tumor detector descends from that single intuition."
    lecture_topic: "Tom Mitchell's three-variable framing (task, experience, performance) · supervised / unsupervised / RL taxonomy · empirical risk minimization · the standard pitfalls of a first project (data leakage, test-set overfitting, miscalibrated metrics)."
    readings:
      - { ref: "Hastie, Tibshirani, Friedman, chapter 1 and section 2.4", url: "https://hastie.su.domains/ElemStatLearn/" }

  - number: "02"
    title: "Linear and Polynomial Regression"
    pitch: "Gauss 1801 predicting Ceres from forty days of observations: the original machine-learning success."
    lecture_topic: "The least-squares estimator (matrix form, projection geometry) · the Gauss-Markov theorem · polynomial regression · regression diagnostics (residuals, leverage, Cook's distance) · the geometry of fitting."
    readings:
      - { ref: "Hastie, Tibshirani, Friedman, chapter 3", url: "" }
    problem_set:
      title: "PS1 — Linear regression by hand and by code"
      problems:
        - "Derive the least-squares estimator from first principles and prove the Gauss-Markov theorem."
        - "Implement linear regression in pure NumPy. Compare with sklearn on three real datasets."
        - "Construct a dataset where leverage and influence diverge significantly."

  - number: "03"
    title: "Classification — Logistic Regression, k-NN, Naive Bayes"
    pitch: "Fisher's 1936 iris dataset: the first formal classification algorithm. The descendants now classify spam, fraud, tumors, signals."
    lecture_topic: "Logistic regression as MLE under Bernoulli noise · linear and quadratic discriminant analysis · $k$-NN and the curse of dimensionality · Naive Bayes and the Sahami 1998 spam filter."
    readings:
      - { ref: "Hastie, Tibshirani, Friedman, chapter 4", url: "" }
    code_lab:
      title: "Lab 1 — Classification on a clinical dataset"
      task: "Build a binary classifier predicting 30-day hospital readmission. Compare logistic regression, $k$-NN, Naive Bayes, and a calibration-aware variant."
      notebook: "lab01-clinical-classification.ipynb"
      dataset: "MIMIC-IV demo (1,000 patients, redistributed)."

  - number: "04"
    title: "Regularization — Ridge, Lasso, Elastic Net"
    pitch: "Hoerl-Kennard 1970 ridge regression: an industrial fix for unstable least squares. Tibshirani 1996 LASSO: variable selection by optimization."
    lecture_topic: "Ridge regression and the bias-variance trade-off · LASSO and the geometry of sparsity · elastic net · cross-validation for tuning the regularization parameter · the Bayesian interpretation (Gaussian and Laplace priors)."
    readings:
      - { ref: "Tibshirani, *Regression Shrinkage and Selection via the Lasso* (JRSS-B 1996)", url: "" }
    problem_set:
      title: "PS2 — Regularization theory"
      problems:
        - "Prove that the ridge regression estimator is the MAP estimator under a Gaussian prior on coefficients."
        - "Show that LASSO produces exact zeros in the solution while ridge does not."
        - "Implement coordinate descent for LASSO from scratch."

  - number: "05"
    title: "Support Vector Machines"
    pitch: "Vapnik 1992: the largest-margin classifier. The dominant method from 1995 to 2012."
    lecture_topic: "Hard-margin SVM as a quadratic program · soft-margin SVM (hinge loss) · the Lagrangian dual and the support-vector identification · the kernel trick · RBF, polynomial, sigmoid kernels."
    readings:
      - { ref: "Boser, Guyon, Vapnik, *A Training Algorithm for Optimal Margin Classifiers* (COLT 1992)", url: "" }
    code_lab:
      title: "Lab 2 — SVM with a kernel sweep"
      task: "Train SVMs with linear, polynomial, and RBF kernels on a public dataset. Tune $C$ and $\\gamma$. Compare against logistic regression baselines. Discuss the kernel trick computational trade-off."
      notebook: "lab02-svm.ipynb"
      dataset: "Adult Census Income (UCI)."

  - number: "06"
    title: "Decision Trees"
    pitch: "Breiman, Friedman, Olshen, Stone 1984: classification by sequential yes/no questions. The transparent classifier."
    lecture_topic: "Decision trees as space partitions · the splitting criteria (Gini, entropy, MSE) · greedy growth · cost-complexity pruning · tree stability and its consequences for the next chapter."
    readings:
      - { ref: "Hastie, Tibshirani, Friedman, chapter 9", url: "" }
    problem_set:
      title: "PS3 — Trees and their limits"
      problems:
        - "Prove that the empirical Gini impurity is bounded between 0 and $1 - 1/k$ for $k$ classes."
        - "Show that decision trees are unstable: small data perturbations can change the tree structure dramatically."
        - "Construct a dataset where a linear classifier beats a tree, and one where the reverse is true."

  - number: "07"
    title: "Ensemble Methods"
    pitch: "The BellKor 2009 Netflix Prize win: 100+ predictors combined linearly. Most Kaggle competitions since."
    lecture_topic: "Bagging and Breiman's random forest (2001) · boosting (AdaBoost, gradient boosting) · stacking · the bias-variance decomposition of ensemble error · XGBoost (Chen 2016) and the GBM tooling stack."
    readings:
      - { ref: "Chen and Guestrin, *XGBoost: A Scalable Tree Boosting System* (KDD 2016)", url: "https://arxiv.org/abs/1603.02754" }
    code_lab:
      title: "Lab 3 — Gradient boosting in production"
      task: "Train XGBoost, LightGBM, and CatBoost on the same dataset. Tune hyperparameters. Compare training time, inference time, and accuracy. Audit feature importance with SHAP."
      notebook: "lab03-boosting.ipynb"
      dataset: "Kaggle bank-loan default (Cameroon subset)."

  - number: "08"
    title: "Unsupervised Learning — Clustering"
    pitch: "Lloyd 1957 at Bell Labs: partition signals into groups, pick a representative, iterate. The most-taught clustering algorithm in ML."
    lecture_topic: "$k$-means and Lloyd's algorithm · hierarchical clustering (linkage methods, dendrograms) · DBSCAN · Gaussian mixture models via EM · choosing $k$ (silhouette, gap statistic, BIC)."
    readings:
      - { ref: "Hastie, Tibshirani, Friedman, chapter 14", url: "" }
    problem_set:
      title: "PS4 — Clustering theory"
      problems:
        - "Prove that $k$-means converges in finite steps."
        - "Show that $k$-means is sensitive to initialization. Construct an example where two initializations give substantially different clusterings."
        - "Implement DBSCAN from scratch. Compare with sklearn on a public dataset."

  - number: "09"
    title: "Dimensionality Reduction"
    pitch: "Pearson 1901: find the hyperplane minimizing orthogonal distances. The result surfaces the eigenvectors of the covariance matrix."
    lecture_topic: "PCA as SVD · probabilistic PCA · factor analysis · t-SNE (van der Maaten 2008) · UMAP (McInnes 2018) · autoencoders for nonlinear dimensionality reduction."
    readings:
      - { ref: "Pearson, *On Lines and Planes of Closest Fit to Systems of Points in Space* (Phil. Mag. 1901)", url: "" }
    code_lab:
      title: "Lab 4 — Visualizing genomic data"
      task: "Apply PCA, t-SNE, and UMAP to a public single-cell RNA-seq dataset. Compare what each method preserves. Discuss the cost of nonlinear methods for downstream interpretation."
      notebook: "lab04-genomic.ipynb"
      dataset: "10x Genomics single-cell PBMC (public)."

  - number: "10"
    title: "Bayesian Learning"
    pitch: "Sahami 1998 Bayesian spam filter: every email service in the world running a variant. The Bayesian posture changes everything for uncertainty quantification."
    lecture_topic: "Naive Bayes as a baseline · Bayesian linear regression · conjugate priors · Gaussian processes at survey level · variational inference and MCMC at survey level."
    readings:
      - { ref: "Murphy, *Probabilistic Machine Learning*, chapter 9 (Bayesian linear models)", url: "" }
    problem_set:
      title: "PS5 — Bayesian inference"
      problems:
        - "Derive the posterior of Bayesian linear regression under a Gaussian prior."
        - "Show that the posterior mean coincides with ridge regression under the right prior."
        - "Implement Gibbs sampling for Bayesian linear regression on a small dataset."

  - number: "11"
    title: "Model Selection and Learning Theory"
    pitch: "Why does any of this work? The statistical learning theory that bounds generalization error."
    lecture_topic: "The PAC framework · VC dimension and uniform convergence · Rademacher complexity · the bias-variance decomposition rigorously · structural risk minimization · model selection via AIC, BIC, cross-validation."
    readings:
      - { ref: "Hastie, Tibshirani, Friedman, chapter 7", url: "" }
    problem_set:
      title: "PS6 — Learning theory"
      problems:
        - "Prove the basic VC dimension upper bound for half-spaces in $\\mathbb{R}^d$."
        - "Derive a generalization bound using Rademacher complexity for a linear class."

  - number: "12"
    title: "Kernel Methods"
    pitch: "Mercer 1909, rediscovered in 1995: an implicit way to work in high-dimensional feature spaces. Every linear algorithm acquires a nonlinear cousin."
    lecture_topic: "Reproducing kernel Hilbert spaces · Mercer's theorem · the representer theorem (Kimeldorf-Wahba 1971) · canonical kernels (linear, polynomial, RBF, Matérn) · kernelized ridge regression, kernel PCA, kernel SVM."
    readings:
      - { ref: "Schölkopf and Smola, *Learning with Kernels* (MIT Press 2002), chapter 2", url: "" }
    discussion:
      paper: "Wilson, Hu, Salakhutdinov, Xing, *Deep Kernel Learning* (AISTATS 2016)"
      url: "https://arxiv.org/abs/1511.02222"
      prompts:
        - "What does deep kernel learning give you that a plain neural network doesn't?"
        - "When are kernel methods still preferable to deep learning in 2026?"
