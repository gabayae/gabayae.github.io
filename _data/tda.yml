course:
  slug: "tda"
  title: "Topological Data Analysis"
  short_title: "TDA"
  level: "Graduate / advanced undergraduate"
  pitch: "Persistent homology, the Mapper algorithm, stability theorems, and what topological features add to a machine-learning pipeline."
  meeting_pattern: "Mondays 14:00–16:00 lecture · Fridays 14:00–15:00 recitation (Africa/Lagos UTC+1)"
  prerequisites: "Real analysis (sequences, continuity, compactness). Linear algebra. Basic probability. Python at the level of writing a 200-line script. No prior algebraic topology required — chapter 2 builds it from scratch."
  grading: "Five problem sets (40%) · two code labs (20%) · paper-discussion recitations (10%) · final project (30%)."
  notes_pdf: "/courses/tda/en/notes.pdf"
  notes_pdf_fr: "/courses/tda/fr/cours.pdf"
  textbook: "Co-authored *The Shape of Data* (No Starch Press), with Colleen Farrelly — recommended companion."
  instructor: "Dr. Yaé Ulrich Gaba"
  status: "self-study"   # self-study | upcoming | active | archive

defaults:
  pset_due: "Sunday 23:59"
  pset_submission: "Pull request on the cohort GitHub repository, or single-file PDF via course email."
  recitation: "Friday 14:00 (Africa/Lagos)"

weeks:
  - number: "01"
    title: "Motivations and Overview"
    pitch: "Why a topologist's tools — persistent homology, Mapper, stability — turn out to be a working data-science primitive."
    lecture_topic: "What TDA is and what it isn't. The shape-of-data thesis. Standard ML features vs topological features. Tour of the rest of the semester."
    readings:
      - { ref: "Carlsson, *Topology and Data* (Bull. AMS 2009)", url: "https://www.ams.org/journals/bull/2009-46-02/S0273-0979-09-01249-X/" }
    code_lab:
      title: "First persistence diagram"
      task: "Compute persistence diagrams of three point clouds (a noisy circle, a torus, two interlocked circles) using ripser, plot, and interpret."
      notebook: "lab01-first-diagrams.ipynb"
      dataset: "Synthetic, generated in-notebook."

  - number: "02"
    title: "Simplicial Complexes and Homology"
    pitch: "The combinatorial machinery: simplicial complexes, chain groups, boundary maps, homology as the kernel of a kernel."
    lecture_topic: "Abstract and geometric simplicial complexes · chain complexes over $\\mathbb{F}_2$ and $\\mathbb{Z}$ · boundary maps · cycles, boundaries, homology · Betti numbers and what they count."
    readings:
      - { ref: "Hatcher, *Algebraic Topology*, sections 2.1–2.2 (or equivalent treatment in Edelsbrunner-Harer ch. III)", url: "https://pi.math.cornell.edu/~hatcher/AT/AT.pdf" }
    problem_set:
      title: "PS1 — Computing homology by hand"
      problems:
        - "Compute $H_0$, $H_1$, $H_2$ of the 2-sphere, 2-torus, and Klein bottle from a chosen triangulation."
        - "Show that homology is independent of the chosen triangulation (sketch)."
        - "Implement the Smith normal form computation for homology of a small complex in Python."

  - number: "03"
    title: "Persistent Homology"
    pitch: "Tracking the birth and death of topological features across a filtration. The persistence module as the central object."
    lecture_topic: "Filtrations · persistence modules · the structure theorem for persistence modules over a PID · barcodes and diagrams as decomposition data."
    readings:
      - { ref: "Carlsson and Zomorodian, *Computing Persistent Homology* (Discrete Comput. Geom. 2005)", url: "" }
    problem_set:
      title: "PS2 — Persistence module structure"
      problems:
        - "Prove the structure theorem for persistence modules over $\\mathbb{F}_2[t]$ in dimension at most 2."
        - "Give an example of a persistence module that is not finitely generated and show its decomposition fails."

  - number: "04"
    title: "Barcodes and Persistence Diagrams"
    pitch: "Two equivalent visualizations of the same data, each with different statistical and ML affordances."
    lecture_topic: "Barcodes vs diagrams · persistence images and landscapes as vectorizations · birth-death normalization · what each visualization optimizes for."
    readings:
      - { ref: "Bubenik, *Statistical topological data analysis using persistence landscapes* (JMLR 2015)", url: "https://www.jmlr.org/papers/v16/bubenik15a.html" }
    code_lab:
      title: "Vectorizing persistence diagrams"
      task: "Take diagrams from week 1's lab, compute persistence landscapes and images, feed both into a sklearn classifier discriminating the three point-cloud types. Compare with raw-feature baseline."
      notebook: "lab02-vectorization.ipynb"
      dataset: "Same synthetic clouds, plus a 4th class for harder test."

  - number: "05"
    title: "Stability Theorems"
    pitch: "Why TDA features can survive noise: the bottleneck-distance stability of diagrams under Hausdorff perturbations."
    lecture_topic: "The bottleneck distance · the stability theorem of Cohen-Steiner-Edelsbrunner-Harer (2007) · interleaving distance and the algebraic stability theorem · what stability buys you in practice."
    readings:
      - { ref: "Cohen-Steiner, Edelsbrunner, Harer, *Stability of Persistence Diagrams* (Discrete Comput. Geom. 2007)", url: "" }
      - { ref: "Chazal, de Silva, Glisse, Oudot, *The Structure and Stability of Persistence Modules*", url: "https://arxiv.org/abs/1207.3674" }
    problem_set:
      title: "PS3 — Stability arguments"
      problems:
        - "Prove the bottleneck stability for $\\check{C}$ech filtrations from a chosen reference."
        - "Construct an explicit perturbation showing the stability bound is tight."

  - number: "06"
    title: "Vietoris–Rips, Čech, Alpha, Witness Complexes"
    pitch: "The decision that ends up mattering most in practice: which complex to build, and why."
    lecture_topic: "Vietoris–Rips · $\\check{C}$ech · alpha complexes (Delaunay triangulation) · witness complexes for landmark-based reduction · the nerve theorem · what each complex costs and when each is appropriate."
    readings:
      - { ref: "Edelsbrunner and Harer, *Computational Topology: An Introduction*, chapter III", url: "" }
    code_lab:
      title: "Comparing complex constructions"
      task: "On the same point cloud, compute persistence with Rips, Čech, and Alpha complexes. Compare diagrams and computation time. Discuss when the differences matter."
      notebook: "lab03-complex-comparison.ipynb"
      dataset: "Public TDA benchmark suite (Anu Mall / scikit-tda)."

  - number: "07"
    title: "The Mapper Algorithm"
    pitch: "TDA's exploratory-analysis cousin: build a topological skeleton of a dataset, label it, look at it."
    lecture_topic: "Filter functions · covers and pullbacks · clustering on pullback subsets · the Mapper graph as visual summary · choices that matter (filter, cover, clusterer) and how to choose them."
    readings:
      - { ref: "Singh, Mémoli, Carlsson, *Topological Methods for the Analysis of High-Dimensional Data Sets* (SPBG 2007)", url: "" }
    problem_set:
      title: "PS4 — Mapper sensitivity"
      problems:
        - "Build a Mapper graph on the iris dataset with three filter functions; characterize how the graph changes."
        - "Construct a dataset where Mapper succeeds and standard $k$-means fails, and vice versa."

  - number: "08"
    title: "Distances between Diagrams"
    pitch: "How to compare two diagrams, and which comparison is mathematically and statistically defensible."
    lecture_topic: "Bottleneck and Wasserstein distances · their stability properties · why $W_p$ for $p < \\infty$ is harder to compute · kernels on diagrams (Reininghaus, Sliced-Wasserstein)."
    readings:
      - { ref: "Reininghaus et al., *A Stable Multi-Scale Kernel for Topological Machine Learning* (CVPR 2015)", url: "" }
    code_lab:
      title: "Statistical tests on diagrams"
      task: "Two-sample test on diagrams: simulate two populations differing in $H_1$ noise level, test for a difference using a sliced-Wasserstein kernel and a permutation test."
      notebook: "lab04-stat-tests.ipynb"
      dataset: "Synthetic."

  - number: "09"
    title: "Machine Learning with TDA"
    pitch: "Where TDA features earn their place in a pipeline — and where they don't."
    lecture_topic: "TDA features as ML inputs · concatenation vs replacement of standard features · when TDA wins (3D structure, sensor data, time series with cycles) and when it doesn't (raw images, tabular data without geometric structure) · honest reporting of TDA gains."
    readings:
      - { ref: "Hensel, Moor, Rieck, *A Survey of Topological Machine Learning Methods* (Front. Artif. Intell. 2021)", url: "https://www.frontiersin.org/articles/10.3389/frai.2021.681108/full" }
    problem_set:
      title: "PS5 — Replication exercise"
      problems:
        - "Replicate one TDA-ML claim from the literature on a public dataset. Report the gain (or lack thereof) over a non-TDA baseline you build."

  - number: "10"
    title: "Applications"
    pitch: "Three case studies: protein structure, neural-network loss surfaces, and gerrymandering detection."
    lecture_topic: "Protein-folding TDA features (Xia, Wei) · loss-landscape topology (Hauser et al.) · electoral-district shape via persistence · what makes an application succeed."
    readings:
      - { ref: "Xia and Wei, *Persistent homology analysis of protein structure* (J. Chem. Phys. 2014)", url: "" }
      - { ref: "Duchin et al., *Mathematics of Districting* (preprint 2018)", url: "" }
    discussion:
      paper: "Hauser, Schwab et al., *On the Topology of Neural Network Loss Landscapes*"
      url: ""
      prompts:
        - "What does TDA see in a loss landscape that standard visualization (3-D projection) doesn't?"
        - "Is the claim falsifiable? What would disprove it?"

  - number: "11"
    title: "TDA and Deep Learning"
    pitch: "Differentiable persistence, topological loss functions, and the frontier of geometric deep learning."
    lecture_topic: "Differentiable persistence (Hofer, Carrière, Royer) · topological loss functions · PersLay and TopologyLayer · open problems."
    readings:
      - { ref: "Hofer et al., *Deep Learning with Topological Signatures* (NeurIPS 2017)", url: "" }
      - { ref: "Carrière et al., *PersLay: A Neural Network Layer for Persistence Diagrams* (AISTATS 2020)", url: "https://arxiv.org/abs/1904.09378" }
    discussion:
      paper: "Moor, Horn, Rieck, Borgwardt, *Topological Autoencoders* (ICML 2020)"
      url: "https://arxiv.org/abs/1906.00722"
      prompts:
        - "Does the topological regularizer materially change what an autoencoder learns?"
        - "What's the right experimental control?"

  - number: "12"
    title: "Final project presentations"
    pitch: "Each participant presents a TDA pipeline applied to a dataset of their choice."
    lecture_topic: "Final project presentations (15 min each + 5 min Q&A)."
    readings: []
