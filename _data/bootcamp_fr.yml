# Source unique de vérité du bootcamp.
# Les dates et liens propres à chaque cohorte remplacent les valeurs par défaut en ligne dans chaque semaine.

defaults:
  timezone: "Africa/Lagos (UTC+1)"
  channel_pattern: "#cohort-week-NN"
  weekly_cadence:
    - { day: Mon, time: "09:00-12:00", kind: live, block: "Cours en direct + code-along" }
    - { day: Mon, time: "14:00-16:00", kind: lab,  block: "Travail de lab en autonomie + permanences assistants" }
    - { day: Tue, time: "09:00-12:00", kind: live, block: "Cours en direct + code-along" }
    - { day: Tue, time: "14:00-16:00", kind: lab,  block: "Travail de lab en autonomie + permanences assistants" }
    - { day: Wed, time: "09:00-12:00", kind: live, block: "Cours en direct + code-along" }
    - { day: Wed, time: "14:00-16:00", kind: lab,  block: "Travail de lab en autonomie + permanences assistants" }
    - { day: Thu, time: "09:00-12:00", kind: live, block: "Cours en direct + code-along" }
    - { day: Thu, time: "14:00-16:00", kind: lab,  block: "Travail de lab en autonomie + permanences assistants" }
    - { day: Fri, time: "10:00-11:00", kind: guest, block: "Intervenant de l'industrie" }
    - { day: Fri, time: "11:30-12:30", kind: review, block: "Revue de lab" }
    - { day: Fri, time: "14:00-15:00", kind: retro, block: "Rétrospective de cohorte" }
  default_deliverable_due: "Vendredi 18h00"
  default_submission: "Déposer l'URL du dépôt dans le canal hebdomadaire de la cohorte. Le binôme de revue par les pairs est annoncé le lundi de la semaine suivante."
  default_rubric: "Validé / à reprendre. La validation exige une CI au vert, des tests couvrant l'API publique, et un README qu'un inconnu peut suivre pour installer et exécuter le code."

weeks:

  - number: "01"
    module: M1
    title: "Python pour le travail de la donnée"
    pitch: "Prenez le Python que vous maîtrisez à moitié et rendez-le assez précis pour être livré."
    deliverable: |
      Dépôt GitHub public contenant le refactor nettoyé du Lab 1 : `README.md`, `pyproject.toml`, suite `pytest` fonctionnelle, CI au vert sur un simple push.
    learning_outcomes:
      - "Écrire du Python idiomatique --- compréhensions, générateurs, context managers, décorateurs."
      - "Utiliser NumPy et Pandas couramment pour la manipulation vectorisée de données."
      - "Construire un projet Python reproductible (virtualenv, `pyproject.toml`, pre-commit, tests de base)."
      - "Lire, modifier et écrire des notebooks Jupyter sans perdre la reproductibilité."
    topics: "Types de données et flux de contrôle · fonctions, portée, closures · classes et protocoles · tableaux NumPy, broadcasting, indexation · Series et DataFrames Pandas, jointures, group-by, reshape · matplotlib et seaborn pour la visualisation · environnements virtuels et gestion des dépendances · bases de Git pour le code et les notebooks."
    labs:
      - title: "Refactorer le script de 300 lignes"
        task: "Un `messy_data_pipeline.py` délibérément mal écrit est fourni. Refactorez-le en un package `src/` typé, avec une couverture `pytest` qui attrape les deux bugs latents, un `pyproject.toml`, un `README.md`, et un workflow GitHub Actions au vert."
        dataset: "Registre des établissements de santé du Kenya, export de décembre 2024 (~12 000 établissements)"
      - title: "Manipulation Pandas sur données réelles"
        task: "À partir des données brutes des établissements de santé du Kenya, produire un DataFrame analytique répondant à trois questions : part public/privé par comté, zones sous-desservies en population par établissement, et effet d'une pondération par capacité d'accueil sur la lecture des résultats."
        dataset: "Même jeu de données que le Lab 1, enrichi des couches de population."
      - title: "Publier votre projet"
        task: "Pousser le package refactoré du Lab 1 sur un dépôt GitHub public avec un tag de release, un `pyproject.toml` versionné, et un badge de CI. Ajoutez-le à votre profil bootcamp."
        dataset: "—"
    readings:
      mandatory:
        - { before: "Mardi", ref: "Hitchhiker's Guide to Python : chapitres \"Writing great Python code\" (en survol)", url: "https://docs.python-guide.org/" }
        - { before: "Mercredi", ref: "Wes McKinney, *Python for Data Analysis* (3e éd., 2022), chapitres 4-5", url: "https://wesmckinney.com/book/" }
        - { before: "Jeudi", ref: "*Python for Data Analysis*, chapitres 8 et 10", url: "https://wesmckinney.com/book/" }
      optional:
        - { ref: "Luciano Ramalho, *Fluent Python* (2e éd., 2022), chapitres 17-18 et 24", note: "Pour les participants qui connaissent déjà bien Pandas." }
    catalogue:
      - { slug: "programmation-scientifiques", label: "Programmation Scientifique" }
      - { slug: "intro-data-science", label: "Introduction à la science des données" }

  - number: "02"
    module: M2
    title: "Introduction à l'apprentissage automatique"
    pitch: "Ce qu'est réellement le ML, ce qu'il n'est pas, et le workflow sous-jacent à tout projet."
    deliverable: |
      Notebook + note de 600 mots : un pipeline train/validation/test propre sur un jeu de données hospitalières réel, avec analyse de calibration et audit explicite des fuites.
    learning_outcomes:
      - "Formuler un problème comme apprentissage supervisé, non supervisé ou par renforcement --- et reconnaître les cas où aucun de ces cadres n'est pertinent."
      - "Construire un pipeline train/validation/test propre qui évite les fuites."
      - "Choisir, ajuster et évaluer un modèle simple sur un jeu de données réel."
      - "Lire une courbe d'apprentissage et une matrice de confusion sans s'y perdre."
    topics: "La boucle de l'apprentissage supervisé · fonctions de perte et risque · minimisation du risque empirique · biais-variance · validation croisée, partitions train/val/test, fuites · métriques d'évaluation pour la classification et la régression · la perspective *no free lunch* sur le choix de modèle."
    labs:
      - title: "Prédiction de réadmission hospitalière"
        task: "Construire un pipeline de régression logistique prédisant la réadmission à 30 jours. Évaluer non seulement via l'AUC, mais aussi par la calibration de Brier et un diagramme de fiabilité."
        dataset: "MIMIC-IV demo (un extrait propre de 1{,}000 patients redistribué avec le bootcamp)."
      - title: "Diagnostiquer l'évaluation cassée"
        task: "Un notebook est fourni avec trois points de fuite délibérés et deux pièges de mauvaise utilisation des métriques. Trouvez-les, corrigez-les, et rédigez une note de 200 mots expliquant chacun d'eux."
        dataset: "Synthétique, fourni."
    readings:
      mandatory:
        - { before: "Mardi", ref: "Hastie, Tibshirani, Friedman, *The Elements of Statistical Learning*, chapitre 7 (sections 7.1-7.4)", url: "https://hastie.su.domains/ElemStatLearn/" }
        - { before: "Mercredi", ref: "Andrew Ng, *Machine Learning Yearning*, chapitres sur les splits dev/test et le biais-variance", url: "https://www.mlyearning.org/" }
      optional:
        - { ref: "Sebastian Raschka, *Model Evaluation, Model Selection, and Algorithm Selection in Machine Learning* (arXiv:1811.12808)", note: "Revue complète des variantes de CV et des tests de significativité." }
    catalogue:
      - { slug: "apprentissage-automatique", label: "Fondements de l'Apprentissage Automatique" }
      - { slug: "intro-data-science", label: "Introduction à la science des données" }

  - number: "03"
    module: M3
    title: "ML classique --- régression, classification, partitionnement"
    pitch: "La boîte à outils pré-deep-learning. Encore la bonne réponse pour la plupart des problèmes tabulaires."
    deliverable: |
      Pipeline de scoring de crédit sur un jeu de données d'une banque africaine, avec notebook d'EDA, comparaison de modèles (logistique + XGBoost), calibration, audit d'équité sur au moins deux coupes démographiques, et une fonction de scoring déployable.
    learning_outcomes:
      - "Ajuster et calibrer la régression linéaire et régularisée (ridge, lasso, elastic net)."
      - "Construire et interpréter des ensembles à base d'arbres (forêts aléatoires, gradient boosting)."
      - "Appliquer les méthodes non supervisées (k-means, hiérarchique, DBSCAN, GMMs, PCA, UMAP)."
      - "Diagnostiquer honnêtement l'importance des variables et la dépendance partielle, sans surinterprétation causale."
    topics: "Régression linéaire et logistique · régularisation (ridge, lasso, elastic net) · SVMs et astuce du noyau · arbres de décision, forêts aléatoires, gradient boosting (XGBoost, LightGBM) · partitionnement (k-means, hiérarchique, DBSCAN, GMM) · réduction de dimension (PCA, UMAP, t-SNE) · interprétation de modèles (importance par permutation, SHAP, dépendance partielle) · ce que ces méthodes peuvent et ne peuvent pas vous dire sur la causalité."
    labs:
      - title: "Scoring de crédit avec audit d'équité"
        task: "Pipeline complet depuis l'EDA jusqu'à la fonction de scoring déployable sur un jeu de données Kaggle d'une banque africaine. Comparer une baseline logistique à XGBoost. Auditer la calibration et l'équité de groupe sur au moins deux coupes démographiques."
        dataset: "Kaggle : *Bank loan default prediction* (sous-ensemble Cameroun)."
      - title: "Segmentation client"
        task: "Partitionner les clients selon leurs schémas de transactions mobile-money. Justifier $k$, caractériser chaque cluster, rédiger une note de 300 mots pour un chef de produit non technique."
        dataset: "Échantillon public et anonymisé de transactions mobile-money (initiative open-data Orange/MTN)."
      - title: "Interprétation SHAP --- et ses modes d'échec"
        task: "Expliquer par SHAP le modèle XGBoost du Lab 1. Puis construire délibérément trois cas où SHAP donne des explications trompeuses et les documenter."
        dataset: "Même que le Lab 1."
    readings:
      mandatory:
        - { before: "Mardi", ref: "Hastie, Tibshirani, Friedman, *ESL*, chapitres 3 (linéaire), 9 (arbres), 10 (boosting)", url: "https://hastie.su.domains/ElemStatLearn/" }
        - { before: "Mercredi", ref: "Christoph Molnar, *Interpretable Machine Learning*, chapitres 5 (SHAP) et 8 (limites)", url: "https://christophm.github.io/interpretable-ml-book/" }
      optional:
        - { ref: "Tianqi Chen et Carlos Guestrin, *XGBoost: A Scalable Tree Boosting System* (KDD 2016)", url: "https://arxiv.org/abs/1603.02754" }
        - { ref: "Cynthia Rudin, *Stop Explaining Black Box Machine Learning Models for High Stakes Decisions* (Nature Machine Intelligence 2019)", url: "https://www.nature.com/articles/s42256-019-0048-x" }
    catalogue:
      - { slug: "apprentissage-automatique", label: "Fondements de l'Apprentissage Automatique" }

  - number: "04"
    module: M4
    title: "Systèmes de recommandation"
    pitch: "Comment fonctionnent réellement les systèmes à la Netflix, et le problème d'évaluation honnête qu'ils créent."
    deliverable: |
      Recommandeur hybride sur un jeu de données e-commerce réel, évalué sur trois métriques hors-ligne avec discussion explicite des raisons de leur désaccord.
    learning_outcomes:
      - "Implémenter le filtrage collaboratif (user-based, item-based, factorisation matricielle)."
      - "Implémenter le filtrage basé contenu avec des plongements."
      - "Construire un recommandeur hybride et l'évaluer avec des métriques hors-ligne (precision@k, NDCG, MAP)."
      - "Comprendre pourquoi les métriques hors-ligne désaccordent souvent avec les résultats A/B en ligne."
    topics: "Le problème de la recommandation · feedback explicite vs implicite · filtrage collaboratif · factorisation matricielle (SVD, ALS, NMF) · filtrage basé contenu avec plongements · modèles hybrides · évaluation : precision@k, recall@k, NDCG, MAP, métriques en ligne vs hors-ligne · cold-start, biais de popularité, bulles de filtre · le problème *you'll never know until you A/B test*."
    labs:
      - title: "Filtre collaboratif MovieLens"
        task: "Construire une factorisation matricielle user-item sur MovieLens 1M, d'abord en SVD brute puis avec ALS. Comparer le RMSE sur des notes retenues."
        dataset: "MovieLens 1M (GroupLens)."
      - title: "Recommandeur e-commerce hybride"
        task: "Combiner des baselines collaborative + contenu + popularité sur un jeu de données e-commerce public. Ajuster les poids du mélange en optimisant precision@10."
        dataset: "Jeu de données public e-commerce brésilien Olist (Kaggle)."
      - title: "Trois métriques, trois classements"
        task: "Prendre trois recommandeurs candidats issus des Labs 1 et 2. Les évaluer sur precision@10, NDCG@10 et MAP@10. Rédiger une note de 400 mots expliquant pourquoi elles classent les modèles différemment."
        dataset: "Mêmes que Labs 1 et 2."
    readings:
      mandatory:
        - { before: "Mardi", ref: "Aggarwal, *Recommender Systems Textbook*, chapitres 1-3 (méthodes de voisinage et basées sur modèle)", url: "https://link.springer.com/book/10.1007/978-3-319-29659-3" }
        - { before: "Mercredi", ref: "Koren, Bell, Volinsky, *Matrix Factorization Techniques for Recommender Systems* (IEEE Computer 2009)", url: "https://datajobs.com/data-science-repo/Recommender-Systems-[Netflix].pdf" }
      optional:
        - { ref: "Maurizio Ferrari Dacrema et al., *Are We Really Making Much Progress? A Worrying Analysis of Recent Neural Recommendation Approaches* (RecSys 2019)", url: "https://arxiv.org/abs/1907.06902" }
    catalogue: []

  - number: "05"
    module: M5
    title: "Traitement automatique du langage"
    pitch: "Des méthodes classiques conscientes de la linguistique au pipeline de l'ère transformer."
    deliverable: |
      Pack de trois livrables : un classifieur de sentiment (baseline logistique + DistilBERT), un tagger NER sur un jeu de données multilingue incluant une langue africaine, et un modèle de résumé fine-tuné.
    learning_outcomes:
      - "Construire un pipeline fonctionnel de classification de texte (nettoyage, tokenisation, vectorisation, entraînement, évaluation)."
      - "Fine-tuner un transformer pré-entraîné sur une tâche de domaine spécifique."
      - "Appliquer le NLP à un cadre multilingue ou à faibles ressources (avec attention aux langues africaines)."
      - "Comprendre les limites : hallucination, biais, difficulté d'évaluation."
    topics: "Prétraitement et tokenisation du texte (BPE, WordPiece) · plongements de mots (Word2Vec, GloVe, FastText) · modèles séquentiels (RNN, LSTM, GRU) · l'architecture Transformer · modèles de la famille BERT et fine-tuning · NER, sentiment, classification, résumé · NLP multilingue et à faibles ressources · évaluation : BLEU, ROUGE, exact match, évaluation humaine."
    labs:
      - title: "Du baseline à BERT pour le sentiment"
        task: "Deux pipelines sur le même corpus d'avis clients : une baseline TF-IDF + logistique et un DistilBERT fine-tuné. Reporter l'accuracy, le macro F1, et la matrice de confusion par classe."
        dataset: "Avis Amazon multilingues (HuggingFace `amazon_reviews_multi`, avec splits français et anglais)."
      - title: "NER multilingue"
        task: "Entraîner une tête de classification de tokens sur un jeu de données multilingue incluant au moins une langue africaine. Reporter le F1 par langue."
        dataset: "MasakhaNER 2.0 (Wolof, Yoruba, Swahili, Hausa, en plus du français et de l'anglais)."
      - title: "Résumé fine-tuné"
        task: "Fine-tuner un T5-base ou BART-base sur un corpus de résumé d'actualités. Évaluer par ROUGE-L *et* par une rubrique d'évaluation humaine de 50 exemples que vous concevez."
        dataset: "XSum ou CNN/DailyMail (baseline anglophone)."
    readings:
      mandatory:
        - { before: "Mardi", ref: "Jurafsky et Martin, *Speech and Language Processing* (3e brouillon), chapitres 6-9 (sémantique vectorielle, LM neuronaux, RNN, transformer)", url: "https://web.stanford.edu/~jurafsky/slp3/" }
        - { before: "Mercredi", ref: "Vaswani et al., *Attention Is All You Need* (NeurIPS 2017)", url: "https://arxiv.org/abs/1706.03762" }
        - { before: "Jeudi", ref: "HuggingFace NLP Course, chapitres 1-3 (fine-tuning d'un modèle pré-entraîné)", url: "https://huggingface.co/learn/nlp-course" }
      optional:
        - { ref: "Projet MasakhaNLP : articles et jeux de données pour les langues africaines", url: "https://www.masakhane.io/" }
    catalogue:
      - { slug: "tal-nlp", label: "Traitement Automatique du Langage" }

  - number: "06"
    module: M6
    title: "ML moderne --- ANN, CNN, RNN"
    pitch: "Le deep learning de bout en bout, avec juste assez de théorie pour savoir quand *ne pas* l'utiliser."
    deliverable: |
      Trois petits livrables : un MLP à 2 couches écrit à la main en NumPy puis porté sur PyTorch, un CNN entraîné sur un jeu de données d'imagerie médicale, et un LSTM pour prédiction séquentielle sur une série temporelle financière.
    learning_outcomes:
      - "Entraîner un réseau de neurones à propagation avant à partir de zéro en NumPy, puis en PyTorch."
      - "Construire, entraîner et évaluer des CNN sur des tâches de classification d'images."
      - "Construire, entraîner et évaluer des RNN/LSTM sur des tâches séquentielles."
      - "Diagnostiquer les pathologies d'entraînement : gradients qui disparaissent, overfitting, neurones morts, décalage de distribution."
    topics: "Réseaux à propagation avant, rétropropagation, optimisation (SGD, Adam, AdamW) · régularisation (dropout, batch norm, weight decay, early stopping) · CNNs (LeNet, AlexNet, ResNet, architectures modernes) · RNNs, LSTMs, GRUs · attention comme primitive · apprentissage de représentations · les leçons amères du deep learning (scaling du calcul, ce qui ne se transfère pas)."
    labs:
      - title: "MLP à la main puis PyTorch"
        task: "Implémenter un MLP à 2 couches avec rétropropagation manuelle en NumPy. Le faire tourner sur MNIST. Puis porter sur PyTorch et vérifier des courbes de perte identiques (à l'aléa stochastique près)."
        dataset: "MNIST (canonique)."
      - title: "CNN d'imagerie médicale avec audit du jeu de données"
        task: "Entraîner un ResNet18 sur un jeu public de radiographies thoraciques. Puis mener un audit de biais : le modèle exploite-t-il des artefacts spécifiques aux hôpitaux ? Rédiger une note de 400 mots sur les constats."
        dataset: "NIH ChestX-ray14 (petit sous-ensemble) + images d'un second hôpital pour test hors-distribution."
      - title: "LSTM pour série temporelle financière"
        task: "Prédire des rendements à 10 jours sur un panier multi-actifs. Comparer le LSTM à une baseline AR(1) et à un prédicteur naïf à dernière valeur. Reporter l'écart embarrassant, puis expliquer pourquoi la prédiction de séries temporelles est plus difficile qu'il n'y paraît."
        dataset: "Clôtures quotidiennes Yahoo Finance pour un panier de 10 tickers, 2010-2024."
    readings:
      mandatory:
        - { before: "Mardi", ref: "Goodfellow, Bengio, Courville, *Deep Learning*, chapitres 6-8 (propagation avant, régularisation, optimisation)", url: "https://www.deeplearningbook.org/" }
        - { before: "Mercredi", ref: "fast.ai *Practical Deep Learning for Coders*, leçons 1-3", url: "https://course.fast.ai/" }
        - { before: "Jeudi", ref: "He, Zhang, Ren, Sun, *Deep Residual Learning for Image Recognition* (CVPR 2016, l'article ResNet)", url: "https://arxiv.org/abs/1512.03385" }
      optional:
        - { ref: "Andrej Karpathy, *A Recipe for Training Neural Networks* (billet de blog 2019)", url: "http://karpathy.github.io/2019/04/25/recipe/" }
    catalogue:
      - { slug: "apprentissage-profond", label: "Apprentissage Profond" }

  - number: "07"
    module: M7
    title: "LLMs et IA générative"
    pitch: "Ce qu'il y a sous le capot de GPT/Claude/LLaMA, ce que vous pouvez réellement en faire, et où ils échouent."
    deliverable: |
      Choisir une des trois pistes : un système RAG sur un corpus de domaine, un fine-tune LoRA d'un modèle de 1 à 7 milliards de paramètres sur une tâche de domaine, ou un agent multi-étapes utilisant des outils.
    learning_outcomes:
      - "Comprendre l'architecture transformer telle qu'elle apparaît dans les LLMs modernes."
      - "Appliquer efficacement les techniques de prompt engineering et de sortie structurée."
      - "Fine-tuner un petit LLM open-source avec LoRA/QLoRA sur un jeu de données de domaine."
      - "Construire un système de génération augmentée par recherche (RAG)."
      - "Évaluer honnêtement la génération : quand un LLM est réellement utile, quand il confabule."
    topics: "Le transformer, mécanisme d'attention, scaling laws · pre-training, fine-tuning, RLHF/DPO en survol · prompt engineering, sortie structurée, function calling · fine-tuning efficace en paramètres (LoRA, QLoRA, PEFT) · RAG : chunking, embedding, retrieval, reranking, génération · modèles de diffusion (intuition + usage pratique) · évaluation : BLEU, ROUGE, LLM-as-judge, évaluation humaine, pourquoi toutes sont partielles · systèmes agentiques et utilisation d'outils · sûreté, alignement, hallucination, biais."
    labs:
      - title: "RAG sur un corpus de domaine"
        task: "Indexer un ensemble de rapports de santé OMS/AFRO dans ChromaDB. Construire retrieval + reranking + génération ancrée. Évaluer fidélité, pertinence du contexte et exactitude des réponses sur un jeu retenu de 30 questions."
        dataset: "Rapports PDF OMS/AFRO (accès libre)."
      - title: "Fine-tune LoRA sur une tâche de domaine"
        task: "Fine-tuner Llama 3.1 8B ou Mistral 7B avec LoRA sur un jeu de données de domaine (Q&R médicales, revue de contrats juridiques, ou suivi d'instructions en langue africaine). Reporter la perplexité et une accuracy sur 50 exemples spécifiques à la tâche."
        dataset: "Choisir parmi trois splits pré-curés."
      - title: "Agent multi-étapes utilisant des outils"
        task: "Construire un agent avec LangGraph ou function-calling combinant recherche, calculatrice et exécution de code. Stresser sur 20 requêtes multi-étapes et documenter les modes d'échec."
        dataset: "Synthétique + outils web en direct."
    readings:
      mandatory:
        - { before: "Mardi", ref: "Vaswani et al., *Attention Is All You Need*", url: "https://arxiv.org/abs/1706.03762" }
        - { before: "Mercredi", ref: "Brown et al., *Language Models are Few-Shot Learners* (l'article GPT-3, sections 1-3)", url: "https://arxiv.org/abs/2005.14165" }
        - { before: "Jeudi", ref: "Lewis et al., *Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks*", url: "https://arxiv.org/abs/2005.11401" }
        - { before: "Vendredi", ref: "Hu et al., *LoRA: Low-Rank Adaptation of Large Language Models*", url: "https://arxiv.org/abs/2106.09685" }
      optional:
        - { ref: "Anthropic, *Building effective agents* (blog d'ingénierie 2024)", url: "https://www.anthropic.com/engineering/building-effective-agents" }
        - { ref: "Karpathy, *Let's build GPT: from scratch, in code, spelled out*", url: "https://www.youtube.com/watch?v=kCc8FmEb1nY" }
    catalogue:
      - { slug: "ia-generative", label: "IA Générative" }

  - number: "08"
    module: M8
    title: "MLOps et déploiement"
    pitch: "Ce qu'il faut pour que le modèle continue de fonctionner une fois le notebook fermé."
    deliverable: |
      Un modèle déployé : modèle entraîné enveloppé dans un service FastAPI, conteneurisé, déployé sur un cloud en free-tier, avec tracking MLflow et un dashboard basique de suivi de dérive.
    learning_outcomes:
      - "Versionner code, données et modèles de manière à soutenir la reproductibilité."
      - "Conteneuriser un modèle et le déployer comme API REST."
      - "Mettre en place le tracking d'expériences, le registre de modèles et le monitoring."
      - "Construire un pipeline CI/CD basique pour un système ML."
    topics: "Reproductibilité (Git, DVC, MLflow) · tracking d'expériences et registre de modèles (MLflow, Weights & Biases) · conteneurisation (Docker, docker-compose) · serving (FastAPI, BentoML, registres de modèles) · monitoring (dérive de données, de prédiction, de performance, latence, coût) · CI/CD pour pipelines ML · la différence entre *le modèle marche sur mon laptop* et *le modèle marche en production pendant six mois*."
    labs:
      - title: "FastAPI + Docker + déploiement free-tier"
        task: "Envelopper un modèle entraîné d'une semaine précédente dans un service FastAPI. Conteneuriser. Déployer sur Render ou Railway. Appeler l'endpoint déployé depuis un nouveau notebook."
        dataset: "Apportez votre modèle de la semaine 3, 6 ou 7."
      - title: "Tracking MLflow pour une boucle de réentraînement"
        task: "Mettre en place le tracking MLflow pour une boucle de réentraînement. Logger hyperparamètres, métriques, artefacts. Promouvoir un modèle de staging vers production via le Model Registry."
        dataset: "Réutiliser un des jeux de données des semaines précédentes."
      - title: "Détection de dérive"
        task: "Simuler une dérive graduelle des données sur un modèle déployé. Construire un dashboard Grafana ou Evidently qui la détecte. Câbler une alerte qui se déclenche sur un seuil PSI."
        dataset: "Dérive synthétique superposée aux données d'une semaine précédente."
    readings:
      mandatory:
        - { before: "Mardi", ref: "Sculley et al., *Hidden Technical Debt in Machine Learning Systems* (NeurIPS 2015)", url: "https://papers.nips.cc/paper/2015/hash/86df7dcfd896fcaf2674f757a2463eba-Abstract.html" }
        - { before: "Mercredi", ref: "Google Cloud, *MLOps: Continuous delivery and automation pipelines in machine learning*", url: "https://cloud.google.com/architecture/mlops-continuous-delivery-and-automation-pipelines-in-machine-learning" }
        - { before: "Jeudi", ref: "Chip Huyen, *Designing Machine Learning Systems* (O'Reilly 2022), chapitres 7-9", url: "https://www.oreilly.com/library/view/designing-machine-learning/9781098107956/" }
      optional:
        - { ref: "Communauté MLOps, *Awesome MLOps* (liste curée)", url: "https://github.com/visenger/awesome-mlops" }
    catalogue:
      - { slug: "mlops", label: "MLOps" }

  - number: "09"
    module: "M9 + M10"
    title: "Semaine de capstone + sessions portfolio"
    pitch: "Semaine de construction concentrée sur le capstone, avec points quotidiens et trois sessions de fabrication du portfolio."
    deliverable: |
      Code freeze du capstone d'ici vendredi. Démo déployée fonctionnelle, README complet, note technique à moitié rédigée. Plus un squelette de site personnel / portfolio publié sur GitHub Pages.
    learning_outcomes:
      - "Livrer un système ML de bout en bout sous une vraie deadline."
      - "Curer trois à cinq projets du bootcamp en un portfolio cohérent."
      - "Rédiger un README de projet qu'un lecteur externe peut suivre en cinq minutes."
      - "Publier notebooks et démos via nbviewer, Colab, HuggingFace Spaces ou GitHub Pages."
    topics: "Mécanique de construction du capstone · discipline du code freeze · fabrication du README · écriture technique pour projets ML · publication de notebooks et démos · à quoi ressemble réellement un portfolio aligné sur les attentes d'un recruteur."
    labs:
      - title: "Code freeze du capstone"
        task: "D'ici vendredi 18h00, le code du capstone est sur `main`, taggé `v0.9-codefreeze`, et la démo déployée est accessible. Aucune nouvelle fonctionnalité après ce point ; uniquement corrections de bugs et rédaction."
        dataset: "Par capstone --- voir le [brief capstone](CAPSTONE.md)."
      - title: "Squelette de portfolio"
        task: "Monter un site de portfolio personnel sur GitHub Pages. Trois cartes de projet minimum, chacune liant à un dépôt public, un court readme, et (le cas échéant) une démo hébergée."
        dataset: "—"
      - title: "Réécriture du README"
        task: "Prendre le README de votre lab préféré (refactor de la semaine 1, scoring de crédit de la semaine 3, etc.). Le réécrire pour qu'un inconnu puisse installer, lancer et comprendre le projet en cinq minutes."
        dataset: "—"
    readings:
      mandatory:
        - { before: "Mardi", ref: "Brief capstone (à relire)", url: "/workshops/ml-ai-bootcamp/CAPSTONE/" }
      optional:
        - { ref: "Portfolio data-science de l'instructeur principal comme exemple", url: "https://gabayae.github.io/data-portfolio/" }
        - { ref: "Will Crichton, *Why Most Published Research Findings are False* appliqué aux démos ML (billet de blog 2023)", url: "https://willcrichton.net/" }
    catalogue: []

  - number: "10"
    module: "M9 + M10"
    title: "Clôture du capstone, présentations finales, lancement du portfolio"
    pitch: "Montrez ce que vous avez construit, publiez ce que vous avez construit, et repartez avec un portfolio qui dit *je sais vraiment faire ça*."
    deliverable: |
      Présentation finale du capstone (10 min de talk + 5 min de Q&R), dépôt public au tag `v1.0`, note technique publiée en billet de blog ou doc du dépôt, site portfolio en ligne avec le capstone mis en avant.
    learning_outcomes:
      - "Présenter un projet ML technique à un public mixte (technique + non technique)."
      - "Publier une note technique du capstone."
      - "Livrer un portfolio qu'un recruteur ou collaborateur peut parcourir en cinq minutes."
      - "Mener une revue par les pairs constructive de deux autres capstones."
    topics: "Art de la présentation technique · ce qu'un recruteur scanne · discipline de la démo en direct (et quoi faire quand elle casse) · étiquette de la revue par les pairs · quoi faire après le bootcamp (recherche d'emploi, contribution open-source, études avancées)."
    labs:
      - title: "Journée des présentations finales"
        task: "Chaque participant ou équipe livre un talk de 10 minutes + 5 minutes de Q&R. Panel d'intervenants de l'industrie en revue. Enregistrement public (avec consentement)."
        dataset: "Par capstone."
      - title: "Lancement du portfolio"
        task: "Site de portfolio publié sur GitHub Pages (ou équivalent), soumis à la vitrine de la cohorte. La promotion croisée interne via tags mutuels sur réseaux sociaux est optionnelle mais encouragée."
        dataset: "—"
      - title: "Revue par les pairs de deux capstones"
        task: "Lire deux autres capstones de bout en bout. Rédiger une revue écrite de 300 mots pour chacun. Les revues sont échangées dans une session structurée de revue par les pairs le vendredi."
        dataset: "Capstones d'autres membres de la cohorte."
    readings:
      mandatory:
        - { before: "Mardi", ref: "Échantillons de capstones des cohortes précédentes (liens dans le canal de la cohorte)", url: "" }
      optional:
        - { ref: "Patrick Mineault, *The Good Research Code Handbook*", url: "https://goodresearch.dev/" }
    catalogue: []
