# Supervision — student theses & essays supervised or co-supervised.
#
# Schema per entry:
#   level          honors | masters | phd
#   year           4-digit year of defense (or "ongoing" for PhD in progress)
#   name           full name as it appears on the thesis
#   title          thesis title; use LaTeX inline math ($…$) where needed
#   institution    OPTIONAL — where the work was done (kept only for entries with confirmed data)
#   summary_en     OPTIONAL — one sentence, English, plain prose
#   summary_fr     OPTIONAL — one sentence, French, plain prose (falls back to summary_en)
#   photo          OPTIONAL — URL/path to a student photo. Shown as circular avatar; falls back to initials.
#   url            OPTIONAL — URL to a public profile (LinkedIn, GitHub, personal site). Wraps the name in a link.
#   pdf            OPTIONAL — public URL only. Leave blank if the PDF stays in the private repo.
#   ongoing        OPTIONAL bool. Set true to display an "Ongoing" badge next to a confirmed title.
#   hide           OPTIONAL bool. Set true to keep entry in this file but off the site.
#
# Rule: never link the private student-theses repo directly (blob URLs 404 for logged-out visitors).

intro:
  en: >
    Below are the honors essays, master's dissertations, and doctoral theses I have
    supervised or co-supervised.
    Titles and short summaries are listed here; full manuscripts are archived in a
    private repository — reach out if you need access for academic purposes.
  fr: >
    Ci-dessous, les mémoires de licence, mémoires de master et thèses de doctorat que
    j'ai encadrés ou co-encadrés.
    Les titres et résumés courts figurent ici ; les manuscrits complets sont archivés
    dans un dépôt privé — n'hésitez pas à me contacter pour un usage académique.

