    summary_fr: >
      Panorama structuré de l'apprentissage par renforcement — recherche de politique,
      fonctions de valeur, optimisation stratégique des actions séquentielles.

  - level: masters
    year: 2025
    name: "Sani AMADOU ABDOU"
    title: "An analytical investigation of parameter estimation techniques in ML: a case study of linear regression"
    summary_en: >
      An analytical study of linear regression parameter estimation — matrix
