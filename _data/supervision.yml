  # 2020 cohort — confirmed.

  - level: masters
    year: 2020
    name: "Abraham O. Orinda"
    title: "Asymmetric Topology: A New Framework in Software Engineering"
    summary_en: >
      Weakens the self-map conditions in Kleene's fixed-point theorem when the
      underlying poset comes from a $T_0$-quasi-metric space, then applies the result
      to asymptotic complexity analysis of algorithms with recurrence-defined runtimes.
    summary_fr: >
      Affaiblit les conditions sur l'application dans le théorème de point fixe de
      Kleene lorsque l'ordre provient d'un espace $T_0$-quasi-métrique, puis applique
      le résultat à l'analyse de complexité asymptotique d'algorithmes définis par
      récurrence.

  - level: masters
    year: 2020
    name: "Fameno Rakotoniaina"
    title: "The Theory of Quasi-Metric Spaces: A Topological Foundation for the Complexity of Algorithms"
    summary_en: >
      Uses the Baire partial metric on the set of finite words over an alphabet to
      analyze algorithmic complexity via fixed-point theorems in partial-metric spaces.
    summary_fr: >
      Utilise la métrique partielle de Baire sur l'ensemble des mots finis d'un
      alphabet pour analyser la complexité algorithmique via des théorèmes de point
      fixe dans les espaces à métrique partielle.

  # 2019 cohort — confirmed.

  - level: masters
    year: 2019
    name: "Precious Blessing Khumalo"
    title: "A Galois connection in the quasi-metrization of an ordered metric space"
    summary_en: >
      A Galois connection between $\mathcal{M}(X)$ — pairs $(m, \leq)$ of a metric and a
      partial order — and $\mathcal{Q}(X)$, the $T_0$-quasi-metrics on $X$.
    summary_fr: >
      Une correspondance de Galois entre $\mathcal{M}(X)$ — paires $(m, \leq)$ d'une
      métrique et d'un ordre partiel — et $\mathcal{Q}(X)$, les $T_0$-quasi-métriques
      sur $X$.

  - level: masters
    year: 2019
    name: "Zainab Olufunke Olukoga"
    title: "Towards an Arbitrage Theorem in an Infinite Horizon"
    summary_en: >
      Extends the no-arbitrage machinery from finite to infinite horizon; a single
      martingale measure on the canonical filtration is not enough — a countable
      family is required.
    summary_fr: >
      Extension du cadre de non-arbitrage de l'horizon fini à l'horizon infini ; une
      seule mesure martingale sur la filtration canonique ne suffit pas — il faut une
      famille dénombrable.

