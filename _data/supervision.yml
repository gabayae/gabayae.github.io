    summary_fr: >
      Étude TDA–GNN de l'élasticité du commerce africain montrant comment la
      complexité topologique façonne la résilience des réseaux commerciaux régionaux
      (données bilatérales 2017–2023).

  - level: masters
    year: 2025
    name: "Christophe Hounwanou"
    title: "Synthetic financial data generation for financial modeling"
    summary_en: >
      Uses GANs and VAEs to generate synthetic financial data addressing scarcity and
