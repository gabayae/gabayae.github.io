# Supervision — student theses & essays supervised at IMSP (Benin) and AIMS network.
#
# Schema per entry:
#   level          honors | masters | phd
#   year           4-digit year of defense (or "ongoing" for PhD in progress)
#   name           full name as it appears on the thesis
#   title          thesis title; use LaTeX inline math ($…$) where needed
#   institution    where the work was done (IMSP Benin, AIMS ZA/SN/RW, etc.)
#   summary_en     one sentence, English, plain prose
#   summary_fr     one sentence, French, plain prose (falls back to summary_en if absent)
#   pdf            OPTIONAL — public URL only. Leave blank if the PDF stays in the private repo.
#   hide           OPTIONAL bool. Set true to keep the entry in this file but off the site.
#
# Rule: never link the private student-theses repo directly (blob URLs 404 for logged-out visitors).
# When a PDF is cleared for public release, drop a copy in /assets/pdf/supervision/ and set `pdf:`.

intro:
  en: >
    Below are the honors essays, master's dissertations, and doctoral theses I have
    supervised or co-supervised at IMSP (Benin) and across the AIMS network.
    Titles and short summaries are listed here; full PDFs are archived in a private
    repository — reach out if you need access for academic purposes.
  fr: >
    Ci-dessous, les mémoires de licence, mémoires de master et thèses de doctorat que
    j'ai encadrés ou co-encadrés à l'IMSP (Bénin) et dans le réseau AIMS.
    Les titres et résumés courts figurent ici ; les PDF complets sont archivés dans
    un dépôt privé — n'hésitez pas à me contacter pour un usage académique.

students:
  # ------------------------------- Honors (Licence) -------------------------------

  - level: honors
    year: 2019
    name: "Dénise Victoire Mondji SAGBO"
    title: "Les quasi-métriques : un goût des structures $T_0$"
    institution: "IMSP, Dangbo (Benin)"
    summary_en: >
      A survey of recent results on quasi-metric and asymmetrically normed spaces,
      following the normed-space playbook (topology, continuous linear operators,
      geometry) and pointing to where the classical picture diverges.
    summary_fr: >
      Étude de résultats récents sur les espaces quasi-métriques et à norme asymétrique,
      en suivant la trame des espaces normés (topologie, opérateurs linéaires continus,
      géométrie) et en soulignant les points où le tableau classique se démarque.

  - level: honors
    year: 2019
    name: "Inès Cocossou"
    title: "Les espaces vectoriels asymétriquement normés et quelques objets associés"
    institution: "IMSP, Dangbo (Benin)"
    summary_en: >
      Topological structure of asymmetrically normed spaces — convergence, continuity,
      and the topological dual, which turns out to be a convex cone rather than a
      linear space.
    summary_fr: >
      Structure topologique des espaces à norme asymétrique — convergence, continuité,
      et le dual topologique, qui n'est pas un espace linéaire mais un cône convexe.

  - level: honors
    year: 2019
    name: "Médard Govoeyi"
    title: "Les espaces vectoriels asymétriquement normés et quelques objets associés"
    institution: "IMSP, Dangbo (Benin)"
    summary_en: >
      Companion to Cocossou (2019) — same core question, complementary treatment of
      the topological duality for asymmetrically normed spaces.
    summary_fr: >
      Pendant du travail de Cocossou (2019) — même problème central, traitement
      complémentaire de la dualité topologique des espaces à norme asymétrique.

  - level: honors
    year: 2020
    name: "Diane Arlette ATINSOUNON"
    title: "Les quasi-métriques : un goût des structures $T_0$"
    institution: "IMSP, Dangbo (Benin)"
    summary_en: >
      Continuation of the $T_0$-quasi-metric program: partial quasi-metrics, the
      specialization order, and completeness notions specific to the asymmetric setting.
    summary_fr: >
      Poursuite du programme sur les $T_0$-quasi-métriques : quasi-métriques
      partielles, ordre de spécialisation et notions de complétude propres au cadre
      asymétrique.

