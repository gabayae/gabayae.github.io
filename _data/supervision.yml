    name: "David KRAME KADURHA"
    title: "Topological Foundations of Reinforcement Learning"
    summary_en: >
      Explores the topological foundations of reinforcement learning to better
      understand the structure and geometry of environments.
    summary_fr: >
      Explore les fondements topologiques de l'apprentissage par renforcement pour
      mieux comprendre la structure et la géométrie des environnements.

  - level: masters
    year: 2025
    name: "Rayda Tatiana Possi Tahabo"
    title: "Portfolio Optimization using Reinforcement Learning"
    summary_en: >
      Applies reinforcement learning to build a dynamic, self-adjusting portfolio
      strategy tuned to market volatility.
    summary_fr: >
      Applique l'apprentissage par renforcement à une stratégie de portefeuille
      dynamique et auto-ajustée en fonction de la volatilité du marché.

  - level: masters
    year: 2025
    name: "Kevin Belingar"
    title: "An Artificial Neural Network Approach to the Black-Scholes Model"
    summary_en: >
      Applies neural networks to the Black-Scholes model so deep architectures learn
      market behaviors and volatility patterns directly from data.
    summary_fr: >
      Applique les réseaux de neurones au modèle de Black-Scholes pour apprendre les
      comportements du marché et la volatilité directement à partir des données.

  - level: masters
    year: 2025
    name: "Solim Pitikalo"
    title: "SVM and Kernel Methods"
    summary_en: >
      A mathematical study of Support Vector Machines and kernel methods, bridging
