    summary_fr: >
      Étude analytique de l'estimation des paramètres en régression linéaire —
      formulations matricielles, hypothèses statistiques, fondements théoriques.

  - level: masters
    year: 2025
    name: "Salam Musa"
    title: "Quantum kernel methods for nonlinear classification problems"
    summary_en: >
      Investigates quantum kernel methods for nonlinear classification, evaluating
